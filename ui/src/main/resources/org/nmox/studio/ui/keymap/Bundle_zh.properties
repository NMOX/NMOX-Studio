CTL_StartOrContinueDebuggingAction=开始调试或继续
CTL_UseVsCodeKeymapAction=使用 VS Code 键盘映射
StartOrContinueDebugging_nothing=没有可调试的内容：请先打开一个项目，然后再开始调试。
StartOrContinueDebugging_running=程序正在运行。它在断点处暂停之后才能继续。
UseVsCodeKeymap_already=键盘映射配置已经是 VS Code。
UseVsCodeKeymap_failed=键盘映射没有更改：无法访问键盘映射设置。请在 工具 ▸ 选项 ▸ 键盘映射 ▸ Profile 下选择 VS Code。
UseVsCodeKeymap_failedMac=键盘映射没有更改：无法访问键盘映射设置。请在 NMOX Studio ▸ Settings… ▸ 键盘映射 ▸ Profile 下选择 VS Code。
UseVsCodeKeymap_noProfile=没有安装 VS Code 键盘映射配置，因此键盘映射没有更改。
UseVsCodeKeymap_switched=键盘映射配置：VS Code。要换回去，请在 工具 ▸ 选项 ▸ 键盘映射 ▸ Profile 下选择其他配置。
UseVsCodeKeymap_switchedMac=键盘映射配置：VS Code。要换回去，请在 NMOX Studio ▸ Settings… ▸ 键盘映射 ▸ Profile 下选择其他配置。
