CTL_StartOrContinueDebuggingAction=Начать отладку или продолжить
CTL_UseVsCodeKeymapAction=Использовать раскладку VS Code
StartOrContinueDebugging_nothing=Нечего отлаживать: сначала откройте проект, затем начните отладку.
StartOrContinueDebugging_running=Программа выполняется. Продолжить её можно, когда она остановится на точке останова.
UseVsCodeKeymap_already=Профиль раскладки уже VS Code.
UseVsCodeKeymap_failed=Раскладка не изменена: не удалось обратиться к настройкам сочетаний клавиш. Выберите VS Code в Сервис ▸ Настройки ▸ Сочетания клавиш ▸ Profile.
UseVsCodeKeymap_failedMac=Раскладка не изменена: не удалось обратиться к настройкам сочетаний клавиш. Выберите VS Code в NMOX Studio ▸ Settings… ▸ Сочетания клавиш ▸ Profile.
UseVsCodeKeymap_noProfile=Профиль раскладки VS Code не установлен, поэтому раскладка не изменена.
UseVsCodeKeymap_switched=Профиль раскладки: VS Code. Чтобы вернуться, выберите другой в Сервис ▸ Настройки ▸ Сочетания клавиш ▸ Profile.
UseVsCodeKeymap_switchedMac=Профиль раскладки: VS Code. Чтобы вернуться, выберите другой в NMOX Studio ▸ Settings… ▸ Сочетания клавиш ▸ Profile.
