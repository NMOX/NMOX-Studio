CTL_StartOrContinueDebuggingAction=Iniciar o continuar la depuración
CTL_UseVsCodeKeymapAction=Usar el mapa de teclado de VS Code
StartOrContinueDebugging_nothing=No hay nada que depurar: abre primero un proyecto y luego inicia la depuración.
StartOrContinueDebugging_running=El programa está en marcha. Se puede continuar cuando se haya detenido en un punto de interrupción.
UseVsCodeKeymap_already=El perfil de teclado ya es VS Code.
UseVsCodeKeymap_failed=El mapa de teclado no cambió: no se pudo acceder a los ajustes del mapa de teclado. Elige VS Code en Herramientas ▸ Opciones ▸ Atajos de teclado ▸ Profile.
UseVsCodeKeymap_failedMac=El mapa de teclado no cambió: no se pudo acceder a los ajustes del mapa de teclado. Elige VS Code en NMOX Studio ▸ Settings… ▸ Atajos de teclado ▸ Profile.
UseVsCodeKeymap_noProfile=El perfil de teclado VS Code no está instalado, así que el mapa de teclado no cambió.
UseVsCodeKeymap_switched=Perfil de teclado: VS Code. Para volver, elige otro en Herramientas ▸ Opciones ▸ Atajos de teclado ▸ Profile.
UseVsCodeKeymap_switchedMac=Perfil de teclado: VS Code. Para volver, elige otro en NMOX Studio ▸ Settings… ▸ Atajos de teclado ▸ Profile.
