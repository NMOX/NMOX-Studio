WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Встроенному браузеру нужна поставляемая среда выполнения.</b><br><br>Установочные сборки NMOX Studio содержат среду выполнения Java с JavaFX, на которой работают движок WebKit этого окна и его инструменты разработчика. Текущий запуск использует обычный JDK без JavaFX (обычное дело для сборки разработчика с --jdkhome), поэтому страницы открываются в системном браузере — все действия «Открыть в браузере» по-прежнему работают.</div></html>
