CTL_StartOrContinueDebuggingAction=Démarrer le débogage ou continuer
CTL_UseVsCodeKeymapAction=Utiliser le profil de raccourcis VS Code
StartOrContinueDebugging_nothing=Rien à déboguer : ouvrez d’abord un projet, puis démarrez le débogage.
StartOrContinueDebugging_running=Le programme est en cours d’exécution. Il pourra continuer une fois arrêté sur un point d’arrêt.
UseVsCodeKeymap_already=Le profil de raccourcis est déjà VS Code.
UseVsCodeKeymap_failed=Les raccourcis n’ont pas été changés : les réglages Raccourcis clavier n’ont pas pu être atteints. Choisissez VS Code sous Outils ▸ Options ▸ Raccourcis clavier ▸ Profile.
UseVsCodeKeymap_failedMac=Les raccourcis n’ont pas été changés : les réglages Raccourcis clavier n’ont pas pu être atteints. Choisissez VS Code sous NMOX Studio ▸ Settings… ▸ Raccourcis clavier ▸ Profile.
UseVsCodeKeymap_noProfile=Le profil de raccourcis VS Code n’est pas installé : les raccourcis n’ont donc pas été changés.
UseVsCodeKeymap_switched=Profil de raccourcis : VS Code. Pour revenir en arrière, choisissez-en un autre sous Outils ▸ Options ▸ Raccourcis clavier ▸ Profile.
UseVsCodeKeymap_switchedMac=Profil de raccourcis : VS Code. Pour revenir en arrière, choisissez-en un autre sous NMOX Studio ▸ Settings… ▸ Raccourcis clavier ▸ Profile.
