HINT_WebBrowserTopComponent=Ang in-app na web browser na may mga kasangkapan para sa developer
WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Kailangan ng nakapaloob na browser ang kalakip na runtime.</b><br><br>Ang mga naka-install na build ng NMOX Studio ay may kasamang Java runtime na may JavaFX, na siyang nagpapaandar sa WebKit engine ng window na ito at sa mga kasangkapan nito para sa developer. Tumatakbo ang paglulunsad na ito sa payak na JDK na walang JavaFX (karaniwan sa isang dev build na may --jdkhome), kaya bumubukas ang mga pahina sa iyong system browser sa halip — gumagana pa rin ang bawat aksyong Buksan sa Browser.</div></html>
