CTL_StartOrContinueDebuggingAction=Iniciar depuração ou continuar
CTL_UseVsCodeKeymapAction=Usar o mapa de teclado do VS Code
StartOrContinueDebugging_nothing=Nada para depurar: abra um projeto primeiro e depois inicie a depuração.
StartOrContinueDebugging_running=O programa está rodando. Ele pode continuar depois de parar num ponto de interrupção.
UseVsCodeKeymap_already=O perfil de teclado já é o VS Code.
UseVsCodeKeymap_failed=O mapa de teclado não foi alterado: não foi possível chegar às configurações de atalhos de teclado. Escolha VS Code em Ferramentas ▸ Opções ▸ Atalhos de teclado ▸ Profile.
UseVsCodeKeymap_failedMac=O mapa de teclado não foi alterado: não foi possível chegar às configurações de atalhos de teclado. Escolha VS Code em NMOX Studio ▸ Settings… ▸ Atalhos de teclado ▸ Profile.
UseVsCodeKeymap_noProfile=O perfil de teclado VS Code não está instalado, então o mapa de teclado não foi alterado.
UseVsCodeKeymap_switched=Perfil de teclado: VS Code. Para voltar, escolha outro em Ferramentas ▸ Opções ▸ Atalhos de teclado ▸ Profile.
UseVsCodeKeymap_switchedMac=Perfil de teclado: VS Code. Para voltar, escolha outro em NMOX Studio ▸ Settings… ▸ Atalhos de teclado ▸ Profile.
