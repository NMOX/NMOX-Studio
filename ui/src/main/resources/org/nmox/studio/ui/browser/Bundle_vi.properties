WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Trình duyệt tích hợp cần môi trường chạy đi kèm.</b><br><br>Các bản cài đặt của NMOX Studio đi kèm một môi trường chạy Java có JavaFX, thứ vận hành động cơ WebKit của cửa sổ này và bộ công cụ nhà phát triển của nó. Lần chạy này đang dùng một JDK thuần không có JavaFX (thường gặp ở bản dựng phát triển với --jdkhome), nên các trang sẽ mở trong trình duyệt hệ thống — mọi thao tác Mở trong trình duyệt vẫn hoạt động.</div></html>
