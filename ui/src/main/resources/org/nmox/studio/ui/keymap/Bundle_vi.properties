CTL_StartOrContinueDebuggingAction=Bắt đầu gỡ lỗi hoặc Tiếp tục
CTL_UseVsCodeKeymapAction=Dùng sơ đồ phím VS Code
StartOrContinueDebugging_nothing=Không có gì để gỡ lỗi: hãy mở một dự án trước, rồi bắt đầu gỡ lỗi.
StartOrContinueDebugging_running=Chương trình đang chạy. Có thể cho nó chạy tiếp khi nó đã tạm dừng ở một điểm dừng.
UseVsCodeKeymap_already=Hồ sơ phím đã là VS Code.
UseVsCodeKeymap_failed=Sơ đồ phím không được thay đổi: không truy cập được phần cài đặt Phím tắt. Hãy chọn VS Code trong Công cụ ▸ Tùy chọn ▸ Phím tắt ▸ Profile.
UseVsCodeKeymap_failedMac=Sơ đồ phím không được thay đổi: không truy cập được phần cài đặt Phím tắt. Hãy chọn VS Code trong NMOX Studio ▸ Settings… ▸ Phím tắt ▸ Profile.
UseVsCodeKeymap_noProfile=Hồ sơ phím VS Code chưa được cài đặt, nên sơ đồ phím không được thay đổi.
UseVsCodeKeymap_switched=Hồ sơ phím: VS Code. Để quay lại, hãy chọn một hồ sơ khác trong Công cụ ▸ Tùy chọn ▸ Phím tắt ▸ Profile.
UseVsCodeKeymap_switchedMac=Hồ sơ phím: VS Code. Để quay lại, hãy chọn một hồ sơ khác trong NMOX Studio ▸ Settings… ▸ Phím tắt ▸ Profile.
