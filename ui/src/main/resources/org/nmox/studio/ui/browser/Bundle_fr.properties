WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Le navigateur intégré a besoin du runtime fourni.</b><br><br>Les versions installées de NMOX Studio embarquent un runtime Java incluant JavaFX, qui alimente le moteur WebKit de cette fenêtre et ses outils de développement. Ce lancement s'exécute sur un JDK ordinaire sans JavaFX (typique d'une version de développement avec --jdkhome) : les pages s'ouvrent donc dans votre navigateur système — toutes les actions « Ouvrir dans le navigateur » fonctionnent toujours.</div></html>
