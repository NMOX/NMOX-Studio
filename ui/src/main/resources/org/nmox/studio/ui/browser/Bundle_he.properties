WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>הדפדפן המובנה צריך את סביבת הריצה המצורפת.</b><br><br>גרסאות מותקנות של NMOX Studio מגיעות עם סביבת ריצה של Java שכוללת JavaFX, שמניעה את מנוע ה‑WebKit של החלון הזה ואת כלי הפיתוח שלו. ההפעלה הזו רצה על JDK רגיל בלי JavaFX (כרגיל בבניית פיתוח עם ‎--jdkhome), ולכן דפים נפתחים במקום זאת בדפדפן של המערכת — כל פעולות "פתיחה בדפדפן" ממשיכות לעבוד.</div></html>
