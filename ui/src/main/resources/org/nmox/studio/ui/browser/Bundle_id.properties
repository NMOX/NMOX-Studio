WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Peramban tertanam memerlukan runtime bawaan.</b><br><br>Versi terpasang NMOX Studio menyertakan runtime Java yang memuat JavaFX, yang menjalankan mesin WebKit jendela ini beserta alat pengembangnya. Peluncuran ini berjalan pada JDK biasa tanpa JavaFX (lazim pada build pengembangan dengan --jdkhome), sehingga halaman terbuka di peramban sistem Anda — semua tindakan Buka di Peramban tetap berfungsi.</div></html>
