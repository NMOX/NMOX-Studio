CTL_StartOrContinueDebuggingAction=Mulai Debug atau Lanjutkan
CTL_UseVsCodeKeymapAction=Gunakan Peta Tombol VS Code
StartOrContinueDebugging_nothing=Tidak ada yang bisa di-debug: buka sebuah proyek dulu, lalu mulai debug.
StartOrContinueDebugging_running=Program sedang berjalan. Program itu bisa dilanjutkan setelah berhenti di sebuah titik henti.
UseVsCodeKeymap_already=Profil peta tombol sudah VS Code.
UseVsCodeKeymap_failed=Peta tombol tidak diubah: pengaturan peta tombol tidak bisa dijangkau. Pilih VS Code di Alat ▸ Opsi ▸ Pintasan keyboard ▸ Profile.
UseVsCodeKeymap_failedMac=Peta tombol tidak diubah: pengaturan peta tombol tidak bisa dijangkau. Pilih VS Code di NMOX Studio ▸ Settings… ▸ Pintasan keyboard ▸ Profile.
UseVsCodeKeymap_noProfile=Profil peta tombol VS Code tidak terpasang, jadi peta tombol tidak diubah.
UseVsCodeKeymap_switched=Profil peta tombol: VS Code. Untuk kembali, pilih profil lain di Alat ▸ Opsi ▸ Pintasan keyboard ▸ Profile.
UseVsCodeKeymap_switchedMac=Profil peta tombol: VS Code. Untuk kembali, pilih profil lain di NMOX Studio ▸ Settings… ▸ Pintasan keyboard ▸ Profile.
