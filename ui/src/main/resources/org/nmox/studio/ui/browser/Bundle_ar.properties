WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>المتصفح المدمج محتاج بيئة التشغيل المرفقة.</b><br><br>نسخ NMOX Studio المتثبّتة بتيجي ومعاها بيئة تشغيل Java فيها JavaFX، وهي اللي بتشغّل محرك WebKit في النافذة دي وأدوات المطورين بتاعته. التشغيل ده شغال على JDK عادي من غير JavaFX (ده المعتاد في نسخة تطوير بـ ‎--jdkhome)، فالصفحات بتفتح في متصفح النظام عندكم بدل كده — وكل أوامر «فتح في المتصفح» لسه شغالة.</div></html>
