WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>O navegador incorporado precisa do runtime incluído.</b><br><br>As versões instaladas do NMOX Studio trazem um runtime Java que inclui o JavaFX, o qual move o motor WebKit desta janela e suas ferramentas de desenvolvedor. Esta execução está usando um JDK simples, sem JavaFX (o normal em uma compilação de desenvolvimento com --jdkhome), então as páginas abrem no seu navegador do sistema — todas as ações Abrir no navegador continuam funcionando.</div></html>
