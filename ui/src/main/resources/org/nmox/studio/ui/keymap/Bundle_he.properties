CTL_StartOrContinueDebuggingAction=התחלת ניפוי או המשך
CTL_UseVsCodeKeymapAction=שימוש במיפוי המקשים של VS Code
StartOrContinueDebugging_nothing=אין מה לנפות: פתחו קודם פרויקט, ואז התחילו ניפוי.
StartOrContinueDebugging_running=התוכנית רצה. אפשר להמשיך אותה אחרי שהיא נעצרת בנקודת עצירה.
UseVsCodeKeymap_already=פרופיל מיפוי המקשים כבר VS Code.
UseVsCodeKeymap_failed=מיפוי המקשים לא שונה: לא ניתן היה להגיע להגדרות מיפוי המקשים. בחרו VS Code תחת כלים ‏◂‏ אפשרויות ‏◂‏ מיפוי מקשים ‏◂‏ Profile.
UseVsCodeKeymap_failedMac=מיפוי המקשים לא שונה: לא ניתן היה להגיע להגדרות מיפוי המקשים. בחרו VS Code תחת NMOX Studio ‏◂‏ Settings… ‏◂‏ מיפוי מקשים ‏◂‏ Profile.
UseVsCodeKeymap_noProfile=פרופיל מיפוי המקשים VS Code אינו מותקן, ולכן מיפוי המקשים לא שונה.
UseVsCodeKeymap_switched=פרופיל מיפוי המקשים: VS Code. כדי לחזור, בחרו פרופיל אחר תחת כלים ‏◂‏ אפשרויות ‏◂‏ מיפוי מקשים ‏◂‏ Profile.
UseVsCodeKeymap_switchedMac=פרופיל מיפוי המקשים: VS Code. כדי לחזור, בחרו פרופיל אחר תחת NMOX Studio ‏◂‏ Settings… ‏◂‏ מיפוי מקשים ‏◂‏ Profile.
