HINT_WebBrowserTopComponent=内置的 Web 浏览器，带开发者工具
WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>内嵌浏览器需要随附的运行时。</b><br><br>NMOX Studio 的安装版附带包含 JavaFX 的 Java 运行时，本窗口的 WebKit 引擎及其开发者工具由它驱动。本次启动使用的是不含 JavaFX 的普通 JDK（开发版用 --jdkhome 启动时很常见），因此页面改为在系统浏览器中打开 — 所有“在浏览器中打开”操作仍然可用。</div></html>
