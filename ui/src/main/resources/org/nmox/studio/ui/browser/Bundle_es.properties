WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>El navegador integrado necesita el entorno de ejecución incluido.</b><br><br>Las versiones instaladas de NMOX Studio incluyen un entorno de ejecución de Java con JavaFX, que impulsa el motor WebKit de esta ventana y sus herramientas para desarrolladores. Este arranque se está ejecutando sobre un JDK simple sin JavaFX (lo habitual en una compilación de desarrollo con --jdkhome), así que las páginas se abren en el navegador del sistema — todas las acciones Abrir en el navegador siguen funcionando.</div></html>
