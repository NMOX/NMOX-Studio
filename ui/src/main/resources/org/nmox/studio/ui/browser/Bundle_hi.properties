WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>एम्बेडेड ब्राउज़र को बंडल किए गए रनटाइम की ज़रूरत है।</b><br><br>NMOX Studio के इंस्टॉल किए गए बिल्ड ऐसा Java रनटाइम भेजते हैं जिसमें JavaFX शामिल है, जो इस विंडो के WebKit इंजन और इसके डेवलपर टूल्स को चलाता है। यह लॉन्च JavaFX रहित सादे JDK पर चल रहा है (dev बिल्ड में --jdkhome के साथ यह सामान्य है), इसलिए पेज इसके बजाय आपके सिस्टम ब्राउज़र में खुलेंगे — Open-in-Browser की हर क्रिया फिर भी काम करती है।</div></html>
