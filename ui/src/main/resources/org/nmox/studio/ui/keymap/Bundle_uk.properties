CTL_StartOrContinueDebuggingAction=Почати налагодження або продовжити
CTL_UseVsCodeKeymapAction=Використовувати розкладку клавіш VS Code
StartOrContinueDebugging_nothing=Нічого налагоджувати: спершу відкрийте проєкт, а тоді почніть налагодження.
StartOrContinueDebugging_running=Програма виконується. Її можна продовжити, коли вона зупиниться на точці зупину.
UseVsCodeKeymap_already=Профіль розкладки клавіш уже — VS Code.
UseVsCodeKeymap_failed=Розкладку клавіш не змінено: не вдалося дістатися її налаштувань. Виберіть VS Code тут: Інструменти ▸ Налаштування ▸ Комбінації клавіш ▸ Profile.
UseVsCodeKeymap_failedMac=Розкладку клавіш не змінено: не вдалося дістатися її налаштувань. Виберіть VS Code тут: NMOX Studio ▸ Settings… ▸ Комбінації клавіш ▸ Profile.
UseVsCodeKeymap_noProfile=Профіль розкладки клавіш VS Code не встановлено, тож розкладку не змінено.
UseVsCodeKeymap_switched=Профіль розкладки клавіш: VS Code. Щоб повернутися, виберіть інший тут: Інструменти ▸ Налаштування ▸ Комбінації клавіш ▸ Profile.
UseVsCodeKeymap_switchedMac=Профіль розкладки клавіш: VS Code. Щоб повернутися, виберіть інший тут: NMOX Studio ▸ Settings… ▸ Комбінації клавіш ▸ Profile.
