UseVsCodeKeymap_switched=Tastaturbelegungsprofil: VS Code. Um zurückzuwechseln, wählen Sie unter Extras ▸ Optionen ▸ Tastaturbelegung ▸ Profile ein anderes.
UseVsCodeKeymap_switchedMac=Tastaturbelegungsprofil: VS Code. Um zurückzuwechseln, wählen Sie unter NMOX Studio ▸ Einstellungen… ▸ Tastaturbelegung ▸ Profile ein anderes.
