WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Wbudowana przeglądarka wymaga dołączonego środowiska uruchomieniowego.</b><br><br>Instalacyjne wydania NMOX Studio zawierają środowisko Java z JavaFX, na którym działa silnik WebKit tego okna oraz jego narzędzia dla programistów. To uruchomienie korzysta ze zwykłego JDK bez JavaFX (typowe dla wersji deweloperskiej z --jdkhome), więc strony otwierają się w przeglądarce systemowej — wszystkie akcje „Otwórz w przeglądarce” nadal działają.</div></html>
