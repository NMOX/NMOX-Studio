WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Вбудованому браузеру потрібне середовище виконання з комплекту.</b><br><br>Встановлені збірки NMOX Studio містять середовище Java з JavaFX, яке живить рушій WebKit цього вікна та його інструменти розробника. Цей запуск виконується на звичайному JDK без JavaFX (типово для збірки розробника з --jdkhome), тому сторінки натомість відкриваються у вашому системному браузері — усі дії «Відкрити в браузері» працюють, як і раніше.</div></html>
