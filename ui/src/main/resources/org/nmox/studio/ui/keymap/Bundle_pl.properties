CTL_StartOrContinueDebuggingAction=Rozpocznij albo kontynuuj debugowanie
CTL_UseVsCodeKeymapAction=Użyj mapy klawiszy VS Code
StartOrContinueDebugging_nothing=Nie ma czego debugować: najpierw otwórz projekt, potem rozpocznij debugowanie.
StartOrContinueDebugging_running=Program działa. Można go kontynuować, gdy zatrzyma się na punkcie przerwania.
UseVsCodeKeymap_already=Profil mapy klawiszy to już VS Code.
UseVsCodeKeymap_failed=Mapa klawiszy się nie zmieniła: nie udało się dotrzeć do ustawień mapy klawiszy. Wybierz VS Code w Narzędzia ▸ Opcje ▸ Skróty klawiszowe ▸ Profile.
UseVsCodeKeymap_failedMac=Mapa klawiszy się nie zmieniła: nie udało się dotrzeć do ustawień mapy klawiszy. Wybierz VS Code w NMOX Studio ▸ Settings… ▸ Skróty klawiszowe ▸ Profile.
UseVsCodeKeymap_noProfile=Profil mapy klawiszy VS Code nie jest zainstalowany, więc mapa klawiszy się nie zmieniła.
UseVsCodeKeymap_switched=Profil mapy klawiszy: VS Code. Aby wrócić, wybierz inny w Narzędzia ▸ Opcje ▸ Skróty klawiszowe ▸ Profile.
UseVsCodeKeymap_switchedMac=Profil mapy klawiszy: VS Code. Aby wrócić, wybierz inny w NMOX Studio ▸ Settings… ▸ Skróty klawiszowe ▸ Profile.
