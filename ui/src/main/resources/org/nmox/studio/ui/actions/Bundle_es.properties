# The learning catalogue's grouping words (v2.133.0). A blurb travels
# with its space; a category and a family are a SHARED vocabulary the
# picker groups by, so they live beside the picker that renders them.
# Only PROSE families have a key here — Python, Go, Solidity and BEAM
# are names, and a name must survive translation intact. A missing key
# returns the family unchanged, which is also what a drop-in author's
# own family needs.
LearnCategory_LANGUAGE=Lenguajes
