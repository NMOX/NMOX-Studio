UseVsCodeKeymap_switched=بروفايل اختصارات لوحة المفاتيح: VS Code. عشان ترجعوا، اختاروا بروفايل تاني من أدوات ◂ الخيارات ◂ اختصارات لوحة المفاتيح ◂ Profile.
UseVsCodeKeymap_switchedMac=بروفايل اختصارات لوحة المفاتيح: VS Code. عشان ترجعوا، اختاروا بروفايل تاني من NMOX Studio ‏◂‏ Settings… ◂ اختصارات لوحة المفاتيح ◂ Profile.
