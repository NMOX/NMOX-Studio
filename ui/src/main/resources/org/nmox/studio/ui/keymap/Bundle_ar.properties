UseVsCodeKeymap_failed=اختصارات لوحة المفاتيح ماتغيّرتش: ماقدرناش نوصل لإعدادات اختصارات لوحة المفاتيح. اختاروا VS Code من أدوات ◂ الخيارات ◂ اختصارات لوحة المفاتيح ◂ Profile.
UseVsCodeKeymap_failedMac=اختصارات لوحة المفاتيح ماتغيّرتش: ماقدرناش نوصل لإعدادات اختصارات لوحة المفاتيح. اختاروا VS Code من NMOX Studio ‏◂‏ Settings… ◂ اختصارات لوحة المفاتيح ◂ Profile.
