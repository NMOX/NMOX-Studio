HINT_WebBrowserTopComponent=Der integrierte Webbrowser mit Entwicklerwerkzeugen
WebBrowserTopComponent_unavailableNote=<html><div style='width:420px'><b>Der eingebettete Browser benötigt die mitgelieferte Laufzeitumgebung.</b><br><br>Installierte Builds von NMOX Studio liefern eine Java-Laufzeitumgebung mit JavaFX aus, die die WebKit-Engine dieses Fensters und seine Entwicklerwerkzeuge antreibt. Dieser Start läuft auf einem einfachen JDK ohne JavaFX (typisch für einen Dev-Build mit --jdkhome), daher werden Seiten stattdessen in Ihrem Systembrowser geöffnet — jede Aktion „Im Browser öffnen“ funktioniert weiterhin.</div></html>
