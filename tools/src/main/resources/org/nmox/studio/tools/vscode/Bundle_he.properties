VsCodeTaskProblems_skipTooLarge=המשימה "⁦{0}⁩" רצה בלי ה-problem matcher שלה ⁦{1}⁩: יש בו ביטוי רגולרי שחורג ממגבלת ⁦{2}⁩ התווים, או יותר תבניות מהמגבלה של ⁦{3}⁩.
VsCodeTaskProblems_skipTooMany=המשימה "⁦{0}⁩" רצה בלי ה-problem matcher שלה ⁦{1}⁩ ובלי אלה שאחריו: נקראים לכל היותר ⁦{2}⁩.
VsCodeTaskProblems_skipMore={0,choice,1#גם problem matcher אחד נוסף שלה לא מוחל|1<גם ⁦{0}⁩ problem matchers נוספים שלה לא מוחלים}.
VsCodeTaskProblems_backgroundBlind=המשימה "⁦{0}⁩" היא משימת רקע, ולאף אחד מה-problem matchers שלה אין תבנית רקע: הבעיות שלה מוצגות כשהיא מסתיימת.
VsCodeTaskSearchProvider_refuseUnquotedValue=המשימה "⁦{0}⁩" רצה ב-cmd.exe ומכניסה את ⁦{1}⁩ לשורת הפקודה שלה, והערך הזה מכיל תו ש-cmd.exe מפרש גם בתוך מירכאות (‎%‎, ‎!‎, מירכאות כפולות או מעבר שורה); שום דבר לא הורץ.
VsCodeTaskSearchProvider_refuseEnvInvalid=המשימה "⁦{0}⁩" מגדירה את משתנה הסביבה "⁦{1}⁩", ואי אפשר לתת לתהליך את השם הזה או את הערך שלו (סימן = או תו NUL); שום דבר לא הורץ.
VsCodeTaskSearchProvider_refuseBatchArgument=המשימה "⁦{0}⁩" מריצה את ⁦{1}⁩, קובץ batch של Windows, עם ארגומנט שמכיל תו ש-cmd.exe קורא כפקודה (‎& | < > ^ % !‎ או מירכאות); שום דבר לא הורץ.
VsCodeTaskSearchProvider_refuseGone=המשימה "⁦{0}⁩" כבר לא נמצאת בקובץ ‎.vscode/tasks.json; שום דבר לא הורץ.
VsCodeTaskSearchProvider_refuseNowAmbiguous=הקובץ ‎.vscode/tasks.json מגדיר עכשיו יותר ממשימה אחת בשם "⁦{0}⁩"; שום דבר לא הורץ.
RunTaskAction_aimMoved=הרצת משימה: פרויקט אחר נפתח בזמן שהרשימה הוצגה; שום דבר לא הורץ.
StartDebuggingAction_aimMoved=התחלת ניפוי: פרויקט אחר נפתח בזמן שהרשימה הוצגה; שום דבר לא הופעל.
