# @Messages keys duplicated here so the hand bundle (which the resource
# copy lands in target/classes over the annotation-generated one) still
# resolves the NPM Explorer's registered name/tooltip — otherwise a
# MissingResourceException surfaces under an unlucky classloader order.
CTL_NpmExplorerAction=NPM Explorer
CTL_NpmExplorerTopComponent=NPM Explorer
HINT_NpmExplorerTopComponent=Shows NPM scripts and dependencies
