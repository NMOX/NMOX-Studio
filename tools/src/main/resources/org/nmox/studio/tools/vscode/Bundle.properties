QuickSearch/VsCodeTasks=VS Code Tasks
VsCodeTaskSearchProvider_run=Run task: {0} \u2014 {1}
VsCodeTaskSearchProvider_runBare=Run task: {0}
VsCodeTaskSearchProvider_running=Running task "{0}"\u2026
VsCodeTaskSearchProvider_failedToStart=Task "{0}" did not start \u2014 the Output window says why.
VsCodeTaskSearchProvider_refuseVariable=This task asks VS Code for {0}; NMOX Studio cannot supply it.
VsCodeTaskSearchProvider_refuseCwdOutside=Task "{0}" runs in {1}, outside the project; NMOX Studio will not run it there.
VsCodeTaskSearchProvider_refuseCwdMissing=Task "{0}" runs in {1}, which does not exist.
VsCodeTaskSearchProvider_refuseType=Task "{0}" is a {1} task, which a VS Code extension provides; NMOX Studio cannot run it.
VsCodeTaskSearchProvider_refuseNoCommand=Task "{0}" names no command to run.
VsCodeTaskSearchProvider_refuseShellMissing=Task "{0}" runs in the shell {1}, which was not found; nothing was run.
VsCodeTaskSearchProvider_refuseShellUnsupported=Task "{0}" names the shell {1}; on Windows, NMOX Studio runs shell tasks only in PowerShell with -Command or in cmd.exe with /c, so nothing was run.
# {0} - the task, {1} - the variable as the file wrote it, e.g. ${file}
VsCodeTaskSearchProvider_refuseNeedsFile=Task "{0}" uses {1}, which needs a file open in the editor; nothing was run.
VsCodeTaskSearchProvider_refuseNeedsSelection=Task "{0}" uses {1}, which needs text selected in the editor; nothing was run.
# {2} - a number: the most characters a selection may have
VsCodeTaskSearchProvider_refuseSelectionTooLong=Task "{0}" uses {1}, and the selection is over the {2}-character limit; nothing was run.
# {0} - the task, {1} - the id of an entry of the "inputs" list in tasks.json
VsCodeTaskSearchProvider_refuseInputUndefined=Task "{0}" asks for the input "{1}", which the inputs in tasks.json do not define; nothing was run.
# {2} - the input type as the file wrote it, e.g. command; promptString and pickString are VS Code names and stay as they are
VsCodeTaskSearchProvider_refuseInputType=Task "{0}" asks for the input "{1}", whose type is {2}; NMOX Studio asks only promptString and pickString inputs, so nothing was run.
# {2} - the attribute name, e.g. description
VsCodeTaskSearchProvider_refuseInputIncomplete=Task "{0}" asks for the input "{1}", which has no "{2}"; VS Code requires it, so nothing was run.
VsCodeTaskSearchProvider_cancelled=Task "{0}" was not run: the question for "{1}" was cancelled.
# {1} - the variable as the file wrote it, e.g. ${input:token}
VsCodeTaskSearchProvider_refusePasswordShown=Task "{0}" uses the password {1} as the name of a program, a folder or an npm script, and those names are printed when it runs; nothing was run.
# {0} - the task Enter was pressed on, {1} - a task that runs before it
VsCodeTaskSearchProvider_refuseDependency=Task "{0}" was not run because of "{1}", which runs before it.
# {0} - the task, {1} - the label its dependsOn names
VsCodeTaskSearchProvider_refuseDependencyMissing=Task "{0}" depends on "{1}", which tasks.json does not define; nothing was run.
VsCodeTaskSearchProvider_refuseDependencyAmbiguous=Task "{0}" depends on "{1}", and tasks.json defines more than one task with that label; nothing was run.
# {1} - a JSON object as the file wrote it
VsCodeTaskSearchProvider_refuseDependencyObject=Task "{0}" depends on {1}, a task named by its type; NMOX Studio runs only the dependencies a label names, so nothing was run.
# {1} - task labels separated by commas, the first repeated at the end
VsCodeTaskSearchProvider_refuseDependencyCycle=Task "{0}" depends on itself ({1}); nothing was run.
# {0} - the background task, {1} - the task that waits for it
VsCodeTaskSearchProvider_refuseDependencyBackground=Task "{0}" is a background task that "{1}" waits for; NMOX Studio cannot tell when a background task is ready, so nothing was run.
# {1} - a number: the most tasks one run may start
VsCodeTaskSearchProvider_refuseChainTooLong=Task "{0}" would start more tasks than the limit of {1}; nothing was run.
# the name of a running chain, where running commands are listed: {0} - the task, {1} - the project folder
VsCodeTaskSearchProvider_chain=Task "{0}" and the tasks before it \u2014 {1}
VsCodeTaskSearchProvider_chainStopped=Task "{0}" was not run: the tasks before it were stopped.
# {1} - the task that failed, {2} - its exit code
VsCodeTaskSearchProvider_chainFailed=Task "{0}" was not run: "{1}", which runs before it, ended with exit code {2}.
VsCodeTaskSearchProvider_chainNotStarted=Task "{0}" was not run: "{1}", which runs before it, did not start \u2014 the Output window says why.
# the title of the dialog that puts one question of a task; {0} - the task
VsCodeTaskPrompts_title=Run task "{0}"
# the accessible name of the question text in that dialog
VsCodeTaskPrompts_question=Question
QuickSearch/VsCodeLaunches=VS Code Launch Configurations
VsCodeLaunchSearchProvider_debug=Debug: {0} \u2014 {1}
VsCodeLaunchSearchProvider_debugBare=Debug: {0}
VsCodeLaunchSearchProvider_starting=Starting the debugger for "{0}"\u2026
VsCodeLaunchSearchProvider_noDebugger=Configuration "{0}" did not start: the breakpoint debugger is not installed.
VsCodeLaunchSearchProvider_refuseType=Configuration "{0}" is a {1} configuration; the NMOX Studio debugger has no adapter for that type.
VsCodeLaunchSearchProvider_refuseRequest=Configuration "{0}" uses request {1}; the NMOX Studio debugger only launches.
VsCodeLaunchSearchProvider_refuseFields=Configuration "{0}" sets {1}, which the NMOX Studio debugger cannot pass on; it would debug something other than what the file says.
VsCodeLaunchSearchProvider_refuseVariable=Configuration "{0}" asks VS Code for {1}; NMOX Studio cannot supply it.
VsCodeLaunchSearchProvider_refuseCompound=Compound "{0}" starts several sessions at once; the NMOX Studio debugger starts one at a time.
VsCodeLaunchSearchProvider_refuseNoTarget=Configuration "{0}" names nothing to debug.
VsCodeLaunchSearchProvider_refuseOutside=Configuration "{0}" points at {1}, outside the project; NMOX Studio will not debug it there.
VsCodeLaunchSearchProvider_refuseMissing=Configuration "{0}" points at {1}, which is not there.
VsCodeLaunchSearchProvider_refuseProgramKind=Configuration "{0}" names {1}, which its debugger type does not run.
VsCodeLaunchSearchProvider_refuseUrl=Configuration "{0}" opens {1}; the NMOX Studio debugger opens only http, https and project files.
# {0} - the project folder's name
VsCodeFilesNotice_title=VS Code files in {0}
# {0} - the Quick Search chord, e.g. \u21e7\u2318P
VsCodeFilesNotice_run=Its tasks and debug configurations are in Quick Search ({0}): type a name.
VsCodeFilesNotice_settings=Its .vscode/settings.json sets the indentation.
