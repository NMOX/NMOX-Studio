# --- problem matchers (3.7.0) ---
# a background task that is already running is not started again: {0} - the task
VsCodeTaskSearchProvider_alreadyWatching=Task "{0}" is already running and watching; it was not started again.
# said when a task with a problem matcher ends, or a watching task finishes a cycle: {0} - the task, {1} - how many problems
VsCodeTaskProblems_found=Task "{0}": {1,choice,0#no problems|1#1 problem|1<{1} problems} found in its output.
# follows VsCodeTaskProblems_found: {0} - how many were not kept, {1} - the limit
VsCodeTaskProblems_dropped={0,choice,1#1 more was|1<{0} more were} over the limit of {1} and not kept.
# follows VsCodeTaskProblems_found: {0} - how many problems name a file that does not exist
VsCodeTaskProblems_missing={0,choice,1#1 names|1<{0} name} a file that is not on disk; the matcher\u2019s fileLocation may not fit this project.
# follows VsCodeTaskProblems_found: {0} - how many lines, {1} - the length limit
VsCodeTaskProblems_longLines={0,choice,1#1 line|1<{0} lines} over the {1}-character limit {0,choice,1#was|1<were} not read.
# follows VsCodeTaskProblems_found: {0} - the matcher or matchers by name, {1} - how many
VsCodeTaskProblems_switchedOff={1,choice,1#Problem matcher {0} was|1<Problem matchers {0} were} switched off: the regular expression took too long on too many lines.
# a problem matcher that is not applied; the task runs all the same. {0} - the task, {1} - the matcher as the file names it ($tsc, or #2 for the second in the list)
VsCodeTaskProblems_skipUnknown=Task "{0}" runs without its problem matcher {1}: a VS Code extension provides that one, and NMOX Studio has no copy of it.
# {2} - the regular expression
VsCodeTaskProblems_skipRegexp=Task "{0}" runs without its problem matcher {1}: its regular expression {2} does not compile here.
# {2} - the part of the regular expression, e.g. \\h
VsCodeTaskProblems_skipDialect=Task "{0}" runs without its problem matcher {1}: its regular expression uses {2}, which means one thing in VS Code and another here.
# {2} - the JSON key, e.g. pattern
VsCodeTaskProblems_skipInvalid=Task "{0}" runs without its problem matcher {1}: its "{2}" is missing, or is not written the way VS Code reads it.
# {2} - what was written: search, or a variable such as ${file}
VsCodeTaskProblems_skipFileLocation=Task "{0}" runs without its problem matcher {1}: NMOX Studio cannot resolve its fileLocation ({2}).
# {2} - the longest regular expression read, in characters; {3} - the most patterns
VsCodeTaskProblems_skipTooLarge=Task "{0}" runs without its problem matcher {1}: it has a regular expression over the {2}-character limit, or more patterns than the limit of {3}.
# {2} - the most matchers one task may have
VsCodeTaskProblems_skipTooMany=Task "{0}" runs without its problem matcher {1} and any after it: at most {2} are read.
# follows one of the VsCodeTaskProblems_skip sentences: {0} - how many more
VsCodeTaskProblems_skipMore={0,choice,1#One more of its matchers is|1<{0} more of its matchers are} not applied either.
# {0} - the task
VsCodeTaskProblems_backgroundBlind=Task "{0}" is a background task, and none of its problem matchers has a background pattern: its problems are listed when it ends.
