name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # zulu, not temurin: these jobs JLINK the bundled runtime, and
          # Temurin 25 ships neither a jmods/ directory nor a linkable
          # run-time image (JEP 493), so jlink refuses outright — "This JDK
          # does not contain packaged modules". Zulu 25 ships all 70 jmods.
          # Verified 2026-08-03 by running bundle-jre.sh against a real Zulu
          # 25.0.4: 78 modules, javafx.web@26.0.2. build-and-test stays on
          # temurin (it only compiles and tests — no jlink).
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Stamp version into branding
        run: |
          sed -i "s/currentVersion=NMOX Studio .*/currentVersion=NMOX Studio ${{ needs.version.outputs.version }}/" \
            branding/src/main/nbm-branding/core/core.jar/org/netbeans/core/startup/Bundle.properties
          # Module spec versions ride the same tag (ledger 20): every module
          # manifest interpolates the root <spec.version> property.
          sed -i "s|<spec.version>.*</spec.version>|<spec.version>${{ needs.version.outputs.version }}</spec.version>|" \
            pom.xml
      - name: Decode NBM signing keystore (optional)
        # Off unless the NBM_SIGNING_KEYSTORE_BASE64 secret is set. When it
        # is, the base64 secret becomes a keystore file and the -Dnbm.keystore
        # property activates the root pom's `sign-nbms` profile, so every
        # module NBM (and thus the update-center catalog) ships signed. Absent
        # the secret, NBMs ship unsigned exactly as before — no regression.
        # See docs/engineering/nbm-signing.md for keystore + secret setup.
        env:
          KEYSTORE_B64: ${{ secrets.NBM_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nmox-signing.jks"
            echo "NBM_SIGN=1" >> "$GITHUB_ENV"
            echo "::notice::NBM signing enabled — module NBMs will be signed."
          else
            echo "::notice::NBM signing skipped (NBM_SIGNING_KEYSTORE_BASE64 not set); NBMs ship unsigned."
          fi
      - name: Build application
        env:
          NBM_ALIAS: ${{ secrets.NBM_SIGNING_ALIAS }}
          NBM_PASS: ${{ secrets.NBM_SIGNING_PASSWORD }}
        run: |
          SIGN_ARGS=""
          if [ "${NBM_SIGN:-}" = "1" ]; then
            SIGN_ARGS="-Dnbm.keystore=$RUNNER_TEMP/nmox-signing.jks -Dnbm.keystorealias=$NBM_ALIAS -Dnbm.keystorepass=$NBM_PASS"
          fi
          mvn -B clean package -DskipTests $SIGN_ARGS
      - name: Software Bill of Materials (CycloneDX)
        run: |
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom
          # The vendored js-debug adapter has no Maven coordinate, so the
          # aggregate BOM cannot see it (ledger 26). Append it by hand from
          # the facts pinned in editor/src/main/release/jsdebug/NOTICE so
          # the SBOM stops having a blind spot. Bump BOTH on upgrades.
          jq '.components += [{
                "type": "library",
                "name": "vscode-js-debug",
                "version": "1.117.0",
                "purl": "pkg:github/microsoft/vscode-js-debug@v1.117.0",
                "licenses": [{"license": {"id": "Apache-2.0"}}],
                "hashes": [{"alg": "SHA-256",
                  "content": "ad8d04ede9d4b75cc290fd5438a65047a06f786d04f604b6112485b36f090772"}],
                "description": "Vendored DAP server (editor/src/main/release/jsdebug); not resolved by Maven, bumped manually per NOTICE"
              }]' target/bom.json > target/bom-full.json
          mv target/bom-full.json target/bom.json
          cp target/bom.json "NMOX-Studio-${{ needs.version.outputs.version }}-sbom.json"
      - name: Update-center catalog (updates.xml + module NBMs)
        # In-app updates (ledger 21): the app's registered update center
        # fetches releases/latest/download/updates.xml, so every release
        # must ship the catalog + the 11 module NBMs it points at. The
        # script pins each NBM URL to THIS release tag (absolute URLs —
        # a cached older catalog must never download newer NBM bytes and
        # trip its own SHA-512 digests) and gates the module set.
        run: ./scripts/build-update-site.sh "${{ needs.version.outputs.version }}"
      - name: Portable zip
        run: |
          cp application/target/NMOX-Studio-app-*.zip \
             "NMOX-Studio-${{ needs.version.outputs.version }}-portable.zip"
          # The nbm plugin zips the cluster before the package-phase
          # bundle-license-notice copy lands LICENSE/NOTICE in it, so the
          # portable zip alone needs them appended here (v1.208.0; the
          # other four artifacts inherit them from target/nmoxstudio).
          mkdir -p zipstage/nmoxstudio
          cp LICENSE NOTICE zipstage/nmoxstudio/
          (cd zipstage && zip -ur "$GITHUB_WORKSPACE/NMOX-Studio-${{ needs.version.outputs.version }}-portable.zip" nmoxstudio)
          rm -rf zipstage
      - name: Cache the jlinked runtime image
        # v2.38.9: the image is a pure function of the JDK build + the
        # FX pins inside bundle-jre.sh — hashing that script (and this
        # workflow, which pins the JDK) invalidates on any pin move.
        uses: actions/cache@v6
        with:
          path: ~/.nmox-jre-image
          key: jre-image-${{ runner.os }}-${{ hashFiles('packaging/tools/bundle-jre.sh', '.github/workflows/release.yml') }}
      - name: Linux tar.gz and deb
        run: NMOX_JRE_IMAGE_CACHE="$HOME/.nmox-jre-image" ./packaging/linux/build-packages.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            NMOX-Studio-*-portable.zip
            NMOX-Studio-*-sbom.json
            application/target/dist/NMOX-Studio-*-linux.tar.gz
            application/target/dist/nmox-studio_*.deb
            target/netbeans_site/updates.xml
            target/netbeans_site/updates.xml.gz
            target/netbeans_site/*.nbm

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # zulu, not temurin: these jobs JLINK the bundled runtime, and
          # Temurin 25 ships neither a jmods/ directory nor a linkable
          # run-time image (JEP 493), so jlink refuses outright — "This JDK
          # does not contain packaged modules". Zulu 25 ships all 70 jmods.
          # Verified 2026-08-03 by running bundle-jre.sh against a real Zulu
          # 25.0.4: 78 modules, javafx.web@26.0.2. build-and-test stays on
          # temurin (it only compiles and tests — no jlink).
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Stamp version into branding
        run: |
          sed -i '' "s/currentVersion=NMOX Studio .*/currentVersion=NMOX Studio ${{ needs.version.outputs.version }}/" \
            branding/src/main/nbm-branding/core/core.jar/org/netbeans/core/startup/Bundle.properties
          # Module spec versions ride the same tag (ledger 20).
          sed -i '' "s|<spec.version>.*</spec.version>|<spec.version>${{ needs.version.outputs.version }}</spec.version>|" \
            pom.xml
      - name: Build application
        run: mvn -B clean package -DskipTests
      - name: Cache the jlinked runtime image
        # v2.38.9: the image is a pure function of the JDK build + the
        # FX pins inside bundle-jre.sh — hashing that script (and this
        # workflow, which pins the JDK) invalidates on any pin move.
        uses: actions/cache@v6
        with:
          path: ~/.nmox-jre-image
          key: jre-image-${{ runner.os }}-${{ hashFiles('packaging/tools/bundle-jre.sh', '.github/workflows/release.yml') }}
      - name: Import Developer ID certificate (optional)
        # Off unless MACOS_SIGNING_CERTIFICATE_BASE64 is set. When it is, the
        # base64 .p12 becomes a temporary keychain on the runner and the
        # identity + notary credentials reach build-dmg.sh through GITHUB_ENV,
        # which signs with a Developer ID under the hardened runtime and
        # notarizes. Absent the secret this step exits 0 having set NOTHING,
        # so build-dmg.sh takes the ad-hoc path it has always taken and the
        # release publishes the same 21 assets. Same law as the NBM keystore
        # above. See docs/engineering/release-signing.md for the secrets.
        #
        # NOT TESTED AGAINST A REAL ACCOUNT: there is no Apple Developer
        # enrolment yet (ledger 86). Written from Apple's documentation,
        # reviewed, and gated so it cannot affect a release without secrets.
        env:
          MACOS_CERT_B64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          if [ -z "$MACOS_CERT_B64" ]; then
            echo "::notice::macOS Developer ID signing skipped (MACOS_SIGNING_CERTIFICATE_BASE64 not set); the app stays ad-hoc signed and unnotarized."
            exit 0
          fi
          # Half a credential is the one shape worth naming: `security import`
          # would fail with its own opaque message and take the release with
          # it, and the missing half is not obvious from that message.
          if [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_CERTIFICATE_BASE64 is set but MACOS_SIGNING_CERTIFICATE_PASSWORD is not — a .p12 carries an export password and it is not optional"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/nmox-signing.keychain-db"
          # A random per-run password: the keychain lives and dies with the
          # ephemeral runner, and nothing else ever needs to open it.
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          # -lut 21600: no auto-lock for six hours. A notarization wait can be
          # long, and a locked keychain fails signing with an opaque error.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without the partition list, codesign's access to the imported key
          # raises an interactive prompt that never gets answered on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # codesign only searches the keychains in the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # The identity is DERIVED rather than carried as a fourth secret:
          # the .p12 knows its own name, and a stale secret would be a second
          # home for it. Refuse loudly if the certificate is not a Developer
          # ID Application one — signing with the wrong kind cannot notarize.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 'Developer ID Application' identity in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "::notice::macOS Developer ID signing enabled."
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$MACOS_NOTARY_KEY_B64" ]; then
            printf '%s' "$MACOS_NOTARY_KEY_B64" | base64 -d > "$RUNNER_TEMP/notary.p8"
            echo "MACOS_NOTARY_KEY_FILE=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Build DMG
        # The MACOS_* variables below are empty on every run without the
        # secrets, and build-dmg.sh branches on MACOS_SIGN_IDENTITY being
        # non-empty — so an unsigned release runs the identical script path.
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: NMOX_JRE_IMAGE_CACHE="$HOME/.nmox-jre-image" ./packaging/macos/build-dmg.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: application/target/dist/NMOX-Studio-*-macos.dmg

  windows:
    needs: version
    runs-on: windows-latest
    # ONE home for the Authenticode credentials, read by
    # packaging/windows/authenticode-sign.ps1 at both signing steps below.
    # Every one of these is the empty string until the secrets exist, and the
    # script exits 0 without touching a file when they are — so a release
    # without them builds byte-identical artifacts to one built before this
    # block was added. See docs/engineering/release-signing.md.
    env:
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # zulu, not temurin: these jobs JLINK the bundled runtime, and
          # Temurin 25 ships neither a jmods/ directory nor a linkable
          # run-time image (JEP 493), so jlink refuses outright — "This JDK
          # does not contain packaged modules". Zulu 25 ships all 70 jmods.
          # Verified 2026-08-03 by running bundle-jre.sh against a real Zulu
          # 25.0.4: 78 modules, javafx.web@26.0.2. build-and-test stays on
          # temurin (it only compiles and tests — no jlink).
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Stamp version into branding
        shell: pwsh
        run: |
          $f = "branding/src/main/nbm-branding/core/core.jar/org/netbeans/core/startup/Bundle.properties"
          (Get-Content $f) -replace 'currentVersion=NMOX Studio .*', 'currentVersion=NMOX Studio ${{ needs.version.outputs.version }}' | Set-Content $f
          # Module spec versions ride the same tag (ledger 20).
          $p = "pom.xml"
          (Get-Content $p) -replace '<spec\.version>.*</spec\.version>', '<spec.version>${{ needs.version.outputs.version }}</spec.version>' | Set-Content $p
      - name: Build application
        run: mvn -B clean package -DskipTests
      - name: Cache the jlinked runtime image
        uses: actions/cache@v6
        with:
          path: jre-image
          key: jre-image-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Bundle Java runtime
        shell: pwsh
        run: |
          # OpenJFX jmods join the runtime (v1.199.0: the embedded
          # browser's engine) — same pin + sha256 law as bundle-jre.sh.
          if (Test-Path "jre-image\bin\java.exe") {
            Write-Host "bundled jre from image cache"
            Copy-Item -Recurse jre-image application\target\nmoxstudio\jre
            & application\target\nmoxstudio\jre\bin\java.exe --list-modules | Select-String "javafx.web" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "cached runtime is missing javafx.web" }
            exit 0
          }
          $fxVersion = "26.0.2"
          $fxSha256 = "8554a293273eac20d172c18455fcf154a54b7879d3f00de28344ebefd8978672"
          $fxZip = "$env:RUNNER_TEMP\openjfx-jmods.zip"
          # same retry law as bundle-jre.sh: a truncated CDN transfer
          # must not take the release with it (v1.207.0 run 1)
          $attempt = 0
          while ($true) {
            $attempt++
            try {
              Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/$fxVersion/openjfx-${fxVersion}_windows-x64_bin-jmods.zip" -OutFile $fxZip
              break
            } catch {
              if ($attempt -ge 5) { throw "OpenJFX jmods download failed after $attempt attempts: $_" }
              Write-Host "jmods download attempt $attempt failed, retrying: $_"
              Start-Sleep -Seconds 3
            }
          }
          $actual = (Get-FileHash $fxZip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $fxSha256) { throw "OpenJFX jmods sha256 mismatch: $actual" }
          Expand-Archive $fxZip -DestinationPath "$env:RUNNER_TEMP\openjfx"
          $fxJmods = "$env:RUNNER_TEMP\openjfx\javafx-jmods-$fxVersion"
          # A JDK's own jmods are OPTIONAL since JDK 24 (JEP 493): a build
          # made with --enable-linkable-runtime ships none, and jlink links
          # the platform modules from the running image instead. Temurin 25
          # is that build on the linux/macOS runners; windows still ships
          # jmods today, so this lane takes the first branch — but it must
          # not BREAK the day windows follows. When the jmods are absent the
          # platform modules are named from `java --list-modules`, because a
          # hand-picked subset would silently ship a narrower runtime.
          if (Test-Path "$env:JAVA_HOME\jmods") {
            $modulePath = "$env:JAVA_HOME\jmods;$fxJmods"
            $addModules = "ALL-MODULE-PATH"
            Write-Host "JDK jmods present"
          } else {
            $modulePath = $fxJmods
            $jdkModules = (& "$env:JAVA_HOME\bin\java.exe" --list-modules |
              ForEach-Object { ($_ -split '@')[0] }) -join ','
            $addModules = "$jdkModules,ALL-MODULE-PATH"
            Write-Host "no JDK jmods (JEP 493) — linking from the image"
          }
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$modulePath" `
            --add-modules "$addModules" `
            --strip-debug --no-header-files --no-man-pages `
            --output application\target\nmoxstudio\jre
          & application\target\nmoxstudio\jre\bin\java.exe --list-modules | Select-String "javafx.web" | Out-Null
          Copy-Item -Recurse application\target\nmoxstudio\jre jre-image
          if (-not $?) { throw "bundled runtime is missing javafx.web" }
          Add-Content application\target\nmoxstudio\etc\nmoxstudio.conf "`n# bundled runtime: the app runs on its own Java, whatever the host has`njdkhome=`"jre`""
          # JEP 472 native-access grant for the FX modules just linked in —
          # the windows mirror of the same step in bundle-jre.sh. The base
          # conf grants ALL-UNNAMED (the platform's JNA bridge); the NAMED
          # javafx modules are only nameable where they exist. Rewrite the
          # ONE default_options line: this .exe launcher greps the file for
          # keys instead of sourcing it, so a second line has no winner.
          # Anchored to the default_options line: the comment block above it
          # names the flag literally to explain itself, and a whole-file
          # replace rewrites that prose too (measured on the sh side).
          $conf = "application\target\nmoxstudio\etc\nmoxstudio.conf"
          $lines = Get-Content $conf
          if (-not ($lines | Where-Object { $_ -like 'default_options=*--enable-native-access=ALL-UNNAMED*' })) {
            throw "base conf lost its --enable-native-access=ALL-UNNAMED grant"
          }
          $lines = $lines | ForEach-Object {
            if ($_ -like 'default_options=*') {
              $_ -replace '--enable-native-access=ALL-UNNAMED(?!,javafx)',
                          '--enable-native-access=ALL-UNNAMED,javafx.graphics,javafx.web'
            } else { $_ }
          }
          Set-Content $conf $lines
          Write-Host "FX native-access grant written to etc/nmoxstudio.conf"
      - name: Brand launcher icons
        # The nbm-maven-plugin launcher stubs ship with the stock NetBeans
        # icon; swap in ours so the exe file icon and pinned-taskbar icon
        # are branded (shortcuts get theirs via IconFilename in the .iss).
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          $launchers = Get-ChildItem application\target\nmoxstudio\bin\*.exe
          if (-not $launchers) { throw "no launcher exes found to brand" }
          foreach ($exe in $launchers) {
            & .\rcedit.exe $exe.FullName --set-icon packaging\icons\nmox-studio.ico
            if ($LASTEXITCODE -ne 0) { throw "rcedit failed on $($exe.Name)" }
            Write-Host "branded $($exe.Name)"
          }
      - name: Sign launcher executables (optional)
        # AFTER rcedit (it rewrites resources, which would break a signature)
        # and BEFORE Inno Setup packages them, so the installed launchers are
        # the signed ones. A no-op without the secrets.
        shell: pwsh
        run: |
          $launchers = Get-ChildItem application\target\nmoxstudio\bin\*.exe | ForEach-Object { $_.FullName }
          if (-not $launchers) { throw "no launcher exes found to sign" }
          ./packaging/windows/authenticode-sign.ps1 @launchers
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ needs.version.outputs.version }} `
            packaging\windows\nmox-studio.iss
      - name: Sign the installer (optional)
        # The setup .exe is the file a user actually downloads and the one
        # SmartScreen judges, so it is signed last, after Inno Setup has
        # produced it. A no-op without the secrets.
        shell: pwsh
        run: |
          $setup = Get-ChildItem application\target\dist\NMOX-Studio-*-windows-setup.exe | ForEach-Object { $_.FullName }
          if (-not $setup) { throw "no installer found to sign" }
          ./packaging/windows/authenticode-sign.ps1 @setup
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: application/target/dist/NMOX-Studio-*-windows-setup.exe

  release:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts
      - name: Checksums + GPG signature
        # The self-signed trust chain (v2.42.0, official certs deferred
        # to v3.0 by decision): one SHA256SUMS manifest over every
        # published asset, detached-signed by the project GPG key (KEYS
        # at the repo root). Verifying the one signature transitively
        # verifies every asset. Basenames only, so `sha256sum -c` works
        # from a download directory.
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          cd artifacts
          find . -type f \( -name 'NMOX-Studio-*' -o -name 'nmox-studio_*.deb' \
              -o -name 'updates.xml' -o -name 'updates.xml.gz' -o -name '*.nbm' \) \
            | sort | while read -r f; do
              sha256sum "$f"
            done | sed 's|  \./.*/|  |; s|  \./|  |' > SHA256SUMS
          printf '%s' "$GPG_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASS" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign \
            --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          echo "--- SHA256SUMS ($(wc -l < SHA256SUMS) entries) ---"
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: NMOX Studio ${{ needs.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/NMOX-Studio-*-portable.zip
            artifacts/**/NMOX-Studio-*-sbom.json
            artifacts/**/NMOX-Studio-*-linux.tar.gz
            artifacts/**/nmox-studio_*.deb
            artifacts/**/NMOX-Studio-*-macos.dmg
            artifacts/**/NMOX-Studio-*-windows-setup.exe
            artifacts/**/updates.xml
            artifacts/**/updates.xml.gz
            artifacts/**/*.nbm
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc

  homebrew:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download macOS DMG
        uses: actions/download-artifact@v8
        with:
          name: macos-artifacts
          path: dmg

      - name: Compute SHA256
        id: sha
        run: |
          DMG=$(ls dmg/NMOX-Studio-*-macos.dmg)
          echo "sha256=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Write cask
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          # DONE in v3.0.0: the build is notarized, so this cask copies the
          # app and does nothing else to it. The quarantine-clear, its four
          # comment lines and the two caveat paragraphs that explained it are
          # gone from BOTH homes - here and Casks/nmox-studio.rb - because
          # CaskGeneratorParityTest holds them byte-identical (v2.149.0).
          #
          # Do not reintroduce them. Rewriting a notarized app after copying
          # is exactly what breaks its seal: measured, an in-place rewrite
          # leaves `codesign --verify` failing with "a sealed resource is
          # missing or invalid". ReleaseSigningLanesGateTest refuses
          # every one of those spellings in either home - and it cannot name
          # them here, because a gate that names a forbidden spelling matches
          # its own explanation (v2.184.0). The test has the list.
          mkdir -p Casks
          cat > Casks/nmox-studio.rb <<EOF
          cask "nmox-studio" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/NMOX/NMOX-Studio/releases/download/v#{version}/NMOX-Studio-#{version}-macos.dmg"
            name "NMOX Studio"
            desc "NetBeans RCP-based IDE for web development"
            homepage "https://github.com/NMOX/NMOX-Studio"

            depends_on macos: :big_sur

            app "NMOX Studio.app"

            zap trash: [
              "~/Library/Application Support/NMOXStudio",
              "~/Library/Caches/org.nmox.studio",
              "~/Library/Preferences/org.nmox.studio.plist",
            ]

            caveats <<~EOS
              After first launch, the in-app updater (Tools > Plugins) keeps
              you current with no Gatekeeper involvement at all.
            EOS
          end
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/nmox-studio.rb
          if git diff --cached --quiet; then
            echo "Cask already current; nothing to commit."
          else
            git commit -m "nmox-studio ${{ needs.version.outputs.version }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
