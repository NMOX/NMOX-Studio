# The bundled website, deployed publicly (v2.41.0, David's call:
# "make it a github pages site") — the EXACT bytes the product ships
# in its cluster (ui/src/main/release/website, gate-pinned to the
# kits' own output by SiteShipsTest) are what the web serves. No
# build step by design: a site that needs one would no longer be the
# site the app serves from InstalledFileLocator.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/src/main/release/website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/src/main/release/website
      - id: deployment
        uses: actions/deploy-pages@v5
