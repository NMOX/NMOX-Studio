name: Windows installer check

# Proves the Windows cosmetic surface end-to-end on a real windows-latest
# runner: the launcher exes get the branded icon (rcedit), the setup exe
# wears it (SetupIconFile), and the installed Start-menu/desktop shortcuts
# point at it (IconFilename). Mirrors the release workflow's Windows job
# minus jlink (the bundled JRE is irrelevant to icon branding and costs
# minutes). Runs on PRs that touch the Windows packaging surface, and on
# demand via workflow_dispatch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'packaging/icons/**'
      - 'packaging/tools/**'
      - 'ui/src/main/java/org/nmox/studio/ui/browser/fx/WebKitTextPath.java'
      - 'ui/src/test/java/org/nmox/studio/ui/browser/fx/WebKitTextPathLiveTest.java'
      - '.github/workflows/windows-installer-check.yml'
      - '.github/workflows/release.yml'

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build application
        run: mvn -B clean package -DskipTests

      # Keep in sync with the "Brand launcher icons" step in release.yml.
      - name: Brand launcher icons
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          $launchers = Get-ChildItem application\target\nmoxstudio\bin\*.exe
          if (-not $launchers) { throw "no launcher exes found to brand" }
          foreach ($exe in $launchers) {
            & .\rcedit.exe $exe.FullName --set-icon packaging\icons\nmox-studio.ico
            if ($LASTEXITCODE -ne 0) { throw "rcedit failed on $($exe.Name)" }
            Write-Host "branded $($exe.Name)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            packaging\windows\nmox-studio.iss

      # rcedit and ISCC both store icon image entries verbatim as RT_ICON
      # resources, so the branded 256px PNG entry from our .ico must appear
      # byte-for-byte inside every launcher exe and the setup exe itself.
      - name: Verify branded icon is embedded
        shell: python
        run: |
          import glob, struct, pathlib

          ico = pathlib.Path('packaging/icons/nmox-studio.ico').read_bytes()
          count = struct.unpack_from('<H', ico, 4)[0]
          png = None
          for i in range(count):
              width = ico[6 + 16 * i]
              size, off = struct.unpack_from('<II', ico, 6 + 16 * i + 8)
              if width == 0:  # 0 encodes the 256px entry
                  png = ico[off:off + size]
          assert png and png[:8] == b'\x89PNG\r\n\x1a\n', 'no PNG 256px entry in the .ico'

          targets = sorted(glob.glob('application/target/nmoxstudio/bin/*.exe'))
          setups = glob.glob('application/target/dist/NMOX-Studio-*-windows-setup.exe')
          assert targets, 'no launcher exes found'
          assert setups, 'no setup exe found'
          targets += setups
          for target in targets:
              data = pathlib.Path(target).read_bytes()
              if png not in data:
                  raise SystemExit(f'FAIL: {target} does not embed the branded icon')
              print(f'OK: {target} embeds the branded icon')

      # Install for real (silently) and check what a user's Start menu and
      # desktop actually get: shortcuts whose icon is the shipped .ico.
      - name: Verify installed shortcuts
        shell: pwsh
        run: |
          $setup = Get-ChildItem application\target\dist\NMOX-Studio-*-windows-setup.exe
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=desktopicon,addtopath','/NORESTART'
          $app = "$env:LOCALAPPDATA\Programs\NMOX Studio"
          if (-not (Test-Path "$app\nmox-studio.ico")) { throw "nmox-studio.ico not installed into $app" }
          $shell = New-Object -ComObject WScript.Shell
          $links = @(
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\NMOX Studio\NMOX Studio.lnk",
            "$env:USERPROFILE\Desktop\NMOX Studio.lnk"
          )
          foreach ($path in $links) {
            if (-not (Test-Path $path)) { throw "missing shortcut: $path" }
            $icon = $shell.CreateShortcut($path).IconLocation
            Write-Host "$path -> icon $icon"
            if ($icon -notmatch 'nmox-studio\.ico') { throw "unbranded shortcut icon: $icon" }
          }

      # `nmox .` from a terminal: the addtopath task (ticked above) installs
      # cli\nmox.cmd and puts that folder on the USER's Path exactly once -
      # a reinstall must not add it again - and the uninstaller takes it out.
      - name: Verify the nmox command on PATH
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\NMOX Studio"
          $cli = "$app\cli"
          function Entries { @(([Environment]::GetEnvironmentVariable('Path', 'User')) -split ';' | Where-Object { $_.TrimEnd('\') -ieq $cli }) }
          if (-not (Test-Path "$cli\nmox.cmd")) { throw "nmox.cmd not installed into $cli" }
          if (-not (Test-Path "$app\bin\nmoxstudio64.exe")) { throw "the launcher nmox.cmd starts is not where it points" }
          if ((Entries).Count -ne 1) { throw "expected $cli on the user Path once, found $((Entries).Count)" }
          $setup = Get-ChildItem application\target\dist\NMOX-Studio-*-windows-setup.exe
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=desktopicon,addtopath','/NORESTART'
          if ((Entries).Count -ne 1) { throw "a reinstall left $cli on the user Path $((Entries).Count) times" }
          Start-Process -FilePath "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ((Entries).Count -ne 0) { throw "the uninstaller left $cli on the user Path" }
          Write-Host "nmox: on Path once after install and reinstall, gone after uninstall"

      # What nmox.cmd hands the launcher, for real: a stand-in
      # bin\nmoxstudio64.exe (compiled here) records its working directory
      # and argv. A folder must arrive as --aim <absolute>, a file as
      # --open <absolute>, an option's value untouched, a missing name as
      # typed - the rule the Unix launchers follow (TerminalCommandGateTest).
      - name: Verify nmox.cmd turns folders and files into --aim and --open
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nmox-shim'
          New-Item -ItemType Directory -Force "$root\cli", "$root\bin", "$root\proj dir\src" | Out-Null
          Copy-Item packaging\windows\nmox.cmd "$root\cli\nmox.cmd"
          Set-Content "$root\proj dir\src\app.js" 'x'
          $record = Join-Path $root 'record.txt'
          $src = 'using System; using System.IO; public static class Stub { public static void Main(string[] a) { ' +
                 'string[] head = { Environment.CurrentDirectory }; File.WriteAllLines(@"' + $record + '.tmp", head); ' +
                 'File.AppendAllLines(@"' + $record + '.tmp", a); File.Move(@"' + $record + '.tmp", @"' + $record + '"); } }'
          Add-Type -TypeDefinition $src -OutputAssembly "$root\bin\nmoxstudio64.exe" -OutputType ConsoleApplication
          $line = '/c ""' + "$root\cli\nmox.cmd" + '" . src\app.js --userdir "' + "$root\u d" + '" missing.txt -J-Xmx1g"'
          Start-Process -FilePath cmd.exe -ArgumentList $line -WorkingDirectory "$root\proj dir" -Wait -NoNewWindow
          for ($i = 0; $i -lt 100 -and -not (Test-Path $record); $i++) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $record)) { throw "nmox.cmd never started the launcher" }
          $got = @(Get-Content $record)
          $want = @("$root\proj dir", '--aim', "$root\proj dir", '--open', "$root\proj dir\src\app.js",
                    '--userdir', "$root\u d", 'missing.txt', '-J-Xmx1g')
          Write-Host "launcher saw:"; $got | ForEach-Object { Write-Host "  [$_]" }
          if (($got -join "`n") -ne ($want -join "`n")) { throw "nmox.cmd handed the launcher the wrong argv" }

  # The one place the Windows half of WebKitTextPath is exercised for real:
  # the library path inside a linked runtime, the exported setter, the
  # offsets and the foreign-function call. v2.172.0 shipped a path that
  # never existed in an image (jlink files a jmod's .dll under bin/javafx,
  # not bin/), and every other test passed. Mirrors release.yml's runtime
  # step; the same test runs on macOS against the installed app's runtime.
  webkit-text-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build the ui module
        run: mvn -B -pl core,ui -am install -DskipTests

      - name: Link a runtime with OpenJFX, as the release does
        shell: pwsh
        run: |
          $fxVersion = "26.0.2"
          $fxSha256 = "8554a293273eac20d172c18455fcf154a54b7879d3f00de28344ebefd8978672"
          $fxZip = "$env:RUNNER_TEMP\openjfx-jmods.zip"
          $attempt = 0
          while ($true) {
            $attempt++
            try {
              Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/$fxVersion/openjfx-${fxVersion}_windows-x64_bin-jmods.zip" -OutFile $fxZip
              break
            } catch {
              if ($attempt -ge 5) { throw "OpenJFX jmods download failed after $attempt attempts: $_" }
              Start-Sleep -Seconds 3
            }
          }
          $actual = (Get-FileHash $fxZip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $fxSha256) { throw "OpenJFX jmods sha256 mismatch: $actual" }
          Expand-Archive $fxZip -DestinationPath "$env:RUNNER_TEMP\openjfx"
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods;$env:RUNNER_TEMP\openjfx\javafx-jmods-$fxVersion" `
            --add-modules ALL-MODULE-PATH `
            --strip-debug --no-header-files --no-man-pages `
            --output "$env:RUNNER_TEMP\jre"
          if (-not (Test-Path "$env:RUNNER_TEMP\jre\bin\javafx\jfxwebkit.dll")) {
            throw "linked runtime has no bin/javafx/jfxwebkit.dll — the path WebKitTextPath looks in"
          }

      - name: Switch WebKit's text path on in that runtime
        shell: pwsh
        # every -D quoted whole: PowerShell splits an unquoted -Dsurefire.foo=bar at
        # the dot and hands maven ".foo=bar" as a lifecycle phase. And the runtime path
        # is $env:RUNNER_TEMP, not %RUNNER_TEMP% — this job's shell is PowerShell, so
        # the cmd form arrived at maven literally.
        run: |
          mvn -B -pl ui surefire:test "-Dtest=WebKitTextPathLiveTest" `
            "-Dsurefire.failIfNoSpecifiedTests=true" "-Dnmox.webkit.live=true" `
            "-Djvm=$env:RUNNER_TEMP\jre\bin\java.exe" `
            "-DargLine=--enable-native-access=ALL-UNNAMED"
