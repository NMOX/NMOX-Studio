name: Windows installer check

# Proves the Windows cosmetic surface end-to-end on a real windows-latest
# runner: the launcher exes get the branded icon (rcedit), the setup exe
# wears it (SetupIconFile), and the installed Start-menu/desktop shortcuts
# point at it (IconFilename). Mirrors the release workflow's Windows job
# minus jlink (the bundled JRE is irrelevant to icon branding and costs
# minutes). Runs on PRs that touch the Windows packaging surface, and on
# demand via workflow_dispatch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'packaging/icons/**'
      - 'packaging/tools/**'
      - 'ui/src/main/java/org/nmox/studio/ui/browser/fx/WebKitTextPath.java'
      - 'ui/src/test/java/org/nmox/studio/ui/browser/fx/WebKitTextPathLiveTest.java'
      - '.github/workflows/windows-installer-check.yml'
      - '.github/workflows/release.yml'

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build application
        run: mvn -B clean package -DskipTests

      # Keep in sync with the "Brand launcher icons" step in release.yml.
      - name: Brand launcher icons
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          $launchers = Get-ChildItem application\target\nmoxstudio\bin\*.exe
          if (-not $launchers) { throw "no launcher exes found to brand" }
          foreach ($exe in $launchers) {
            & .\rcedit.exe $exe.FullName --set-icon packaging\icons\nmox-studio.ico
            if ($LASTEXITCODE -ne 0) { throw "rcedit failed on $($exe.Name)" }
            Write-Host "branded $($exe.Name)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            packaging\windows\nmox-studio.iss

      # rcedit and ISCC both store icon image entries verbatim as RT_ICON
      # resources, so the branded 256px PNG entry from our .ico must appear
      # byte-for-byte inside every launcher exe and the setup exe itself.
      - name: Verify branded icon is embedded
        shell: python
        run: |
          import glob, struct, pathlib

          ico = pathlib.Path('packaging/icons/nmox-studio.ico').read_bytes()
          count = struct.unpack_from('<H', ico, 4)[0]
          png = None
          for i in range(count):
              width = ico[6 + 16 * i]
              size, off = struct.unpack_from('<II', ico, 6 + 16 * i + 8)
              if width == 0:  # 0 encodes the 256px entry
                  png = ico[off:off + size]
          assert png and png[:8] == b'\x89PNG\r\n\x1a\n', 'no PNG 256px entry in the .ico'

          targets = sorted(glob.glob('application/target/nmoxstudio/bin/*.exe'))
          setups = glob.glob('application/target/dist/NMOX-Studio-*-windows-setup.exe')
          assert targets, 'no launcher exes found'
          assert setups, 'no setup exe found'
          targets += setups
          for target in targets:
              data = pathlib.Path(target).read_bytes()
              if png not in data:
                  raise SystemExit(f'FAIL: {target} does not embed the branded icon')
              print(f'OK: {target} embeds the branded icon')

      # Install for real (silently) and check what a user's Start menu and
      # desktop actually get: shortcuts whose icon is the shipped .ico.
      - name: Verify installed shortcuts
        shell: pwsh
        run: |
          $setup = Get-ChildItem application\target\dist\NMOX-Studio-*-windows-setup.exe
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=desktopicon,addtopath','/NORESTART'
          $app = "$env:LOCALAPPDATA\Programs\NMOX Studio"
          if (-not (Test-Path "$app\nmox-studio.ico")) { throw "nmox-studio.ico not installed into $app" }
          $shell = New-Object -ComObject WScript.Shell
          $links = @(
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\NMOX Studio\NMOX Studio.lnk",
            "$env:USERPROFILE\Desktop\NMOX Studio.lnk"
          )
          foreach ($path in $links) {
            if (-not (Test-Path $path)) { throw "missing shortcut: $path" }
            $icon = $shell.CreateShortcut($path).IconLocation
            Write-Host "$path -> icon $icon"
            if ($icon -notmatch 'nmox-studio\.ico') { throw "unbranded shortcut icon: $icon" }
          }

      # `nmox .` from a terminal: the addtopath task (ticked above) installs
      # cli\nmox.cmd and puts that folder on the USER's Path exactly once -
      # a reinstall must not add it again - and the uninstaller takes it out.
      # Then the Path's own shape, read raw (unexpanded) from the registry:
      # a user with NO Path gets exactly the folder (never ";<folder>", what
      # {olddata};{app}\cli wrote) and has no Path again after uninstall; a
      # Path holding an empty entry (";;") gets the folder appended and is
      # given back byte for byte, the empty entry included.
      - name: Verify the nmox command on PATH
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\NMOX Studio"
          $cli = "$app\cli"
          function Entries { @(([Environment]::GetEnvironmentVariable('Path', 'User')) -split ';' | Where-Object { $_.TrimEnd('\') -ieq $cli }) }
          if (-not (Test-Path "$cli\nmox.cmd")) { throw "nmox.cmd not installed into $cli" }
          if (-not (Test-Path "$app\bin\nmoxstudio64.exe")) { throw "the launcher nmox.cmd starts is not where it points" }
          if ((Entries).Count -ne 1) { throw "expected $cli on the user Path once, found $((Entries).Count)" }
          $setup = Get-ChildItem application\target\dist\NMOX-Studio-*-windows-setup.exe
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=desktopicon,addtopath','/NORESTART'
          if ((Entries).Count -ne 1) { throw "a reinstall left $cli on the user Path $((Entries).Count) times" }
          Start-Process -FilePath "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if ((Entries).Count -ne 0) { throw "the uninstaller left $cli on the user Path" }
          Write-Host "nmox: on Path once after install and reinstall, gone after uninstall"
          function RawPath { (Get-Item 'HKCU:\Environment').GetValue('Path', $null, 'DoNotExpandEnvironmentNames') }
          $saved = RawPath
          try {
            Remove-ItemProperty -Path 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue
            Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
              '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=addtopath','/NORESTART'
            $now = RawPath
            Write-Host "no Path before install -> [$now]"
            if ($now -ne $cli) { throw "with no user Path the installer wrote [$now], not [$cli]" }
            Start-Process -FilePath "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            $now = RawPath
            if ($null -ne $now) { throw "the uninstaller left a user Path [$now] where there was none" }
            $mine = 'C:\keep one;;%USERPROFILE%\keep two'
            New-ItemProperty -Path 'HKCU:\Environment' -Name Path -PropertyType ExpandString -Value $mine -Force | Out-Null
            Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
              '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=addtopath','/NORESTART'
            $now = RawPath
            Write-Host "[$mine] -> [$now]"
            if ($now -ne "$mine;$cli") { throw "the installer wrote [$now], not [$mine;$cli]" }
            Start-Process -FilePath "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            $now = RawPath
            if ($now -ne $mine) { throw "the uninstaller left [$now], not the [$mine] it found" }
            Write-Host "nmox: no leading separator on an empty Path; a Path with an empty entry given back intact"
          } finally {
            if ($null -eq $saved) { Remove-ItemProperty -Path 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue }
            else { New-ItemProperty -Path 'HKCU:\Environment' -Name Path -PropertyType ExpandString -Value $saved -Force | Out-Null }
          }

      # "Open with NMOX Studio" on a folder and inside one (3.1.0): the
      # contextmenu task is unticked by default, so a default install writes
      # no key; ticked, both keys carry the English label (this runner's
      # language), the shipped icon and `--aim "%V\."`; the uninstaller
      # takes them out. Then what Explorer would run, for real: the command
      # with %V filled in - a folder with spaces and a drive root, whose
      # trailing backslash is why the command says %V\. - handed to a
      # stand-in launcher that records the argv it received.
      - name: Verify "Open with NMOX Studio" on folders in Explorer
        shell: pwsh
        run: |
          $setup = Get-ChildItem application\target\dist\NMOX-Studio-*-windows-setup.exe
          $app = "$env:LOCALAPPDATA\Programs\NMOX Studio"
          $keys = @('HKCU:\Software\Classes\Directory\shell\NMOXStudio',
                    'HKCU:\Software\Classes\Directory\Background\shell\NMOXStudio')
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART'
          foreach ($k in $keys) { if (Test-Path $k) { throw "a default install wrote $k - the task must be unticked" } }
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS=addtopath,contextmenu','/NORESTART'
          $want = '"' + "$app\bin\nmoxstudio64.exe" + '" --aim "%V\."'
          foreach ($k in $keys) {
            if (-not (Test-Path "$k\command")) { throw "missing $k\command" }
            $label = (Get-Item $k).GetValue('')
            $icon = (Get-Item $k).GetValue('Icon')
            $cmd = (Get-Item "$k\command").GetValue('')
            Write-Host "$k -> [$label] icon=$icon command=$cmd"
            if ($label -ne 'Open with NMOX Studio') { throw "wrong label: $label" }
            if ($icon -ne "$app\nmox-studio.ico" -or -not (Test-Path $icon)) { throw "wrong or missing icon: $icon" }
            if ($cmd -ne $want) { throw "wrong command: $cmd (want $want)" }
          }
          if (-not (Test-Path "$app\bin\nmoxstudio64.exe")) { throw "the command names a launcher that is not installed" }
          $root = Join-Path $env:RUNNER_TEMP 'nmox-verb'
          New-Item -ItemType Directory -Force "$root\a folder" | Out-Null
          $record = Join-Path $root 'argv.txt'
          $src = 'using System.IO; public static class Stub { public static void Main(string[] a) { File.WriteAllLines(@"' + $record + '", a); } }'
          Add-Type -TypeDefinition $src -OutputAssembly "$root\stub.exe" -OutputType ConsoleApplication
          $tail = $want.Substring($want.IndexOf(' --aim ') + 1)
          foreach ($folder in @("$root\a folder", [System.IO.Path]::GetPathRoot($root))) {
            Remove-Item $record -ErrorAction SilentlyContinue
            Start-Process -FilePath "$root\stub.exe" -ArgumentList $tail.Replace('%V', $folder) -Wait -NoNewWindow
            $got = @(Get-Content $record)
            Write-Host "Explorer on [$folder] -> launcher saw:"; $got | ForEach-Object { Write-Host "  [$_]" }
            if ($got.Count -ne 2 -or $got[0] -ne '--aim' -or $got[1] -ne "$folder\.") { throw "the verb handed the launcher the wrong argv for $folder" }
          }
          Start-Process -FilePath "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          foreach ($k in $keys) { if (Test-Path $k) { throw "the uninstaller left $k" } }
          Write-Host "Open with NMOX Studio: absent by default, present when ticked, gone after uninstall"

      # What nmox.cmd hands the launcher, for real: a stand-in
      # bin\nmoxstudio64.exe (compiled here) records its working directory
      # and argv. A folder must arrive as --aim <absolute>, a file as
      # --open <absolute>, an option's value untouched - the rule the Unix
      # launchers follow (TerminalCommandGateTest). The file named with
      # % ^ & ! is the one `call set` mangled (CALL expands % again and
      # doubles ^); %NMOXNOPE% is left alone by cmd /c's own parse because
      # the variable is undefined, so only a second expansion inside the
      # shim could eat it. Then the refusals: a missing name, a missing
      # --aim value and a FILE given to --aim each exit 2 with the sentence
      # on stderr, and the launcher never starts; so does NAME:LINE when
      # NAME is missing or a folder.
      - name: Verify nmox.cmd turns folders and files into --aim and --open
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nmox-shim'
          New-Item -ItemType Directory -Force "$root\cli", "$root\bin", "$root\proj dir\src" | Out-Null
          Copy-Item packaging\windows\nmox.cmd "$root\cli\nmox.cmd"
          Set-Content "$root\proj dir\src\app.js" 'x'
          $odd = 'p%NMOXNOPE%q ^r &s !t.js'
          Set-Content -LiteralPath "$root\proj dir\src\$odd" 'x'
          $record = Join-Path $root 'record.txt'
          $src = 'using System; using System.IO; public static class Stub { public static void Main(string[] a) { ' +
                 'string[] head = { Environment.CurrentDirectory }; File.WriteAllLines(@"' + $record + '.tmp", head); ' +
                 'File.AppendAllLines(@"' + $record + '.tmp", a); File.Move(@"' + $record + '.tmp", @"' + $record + '"); } }'
          Add-Type -TypeDefinition $src -OutputAssembly "$root\bin\nmoxstudio64.exe" -OutputType ConsoleApplication
          $line = '/c ""' + "$root\cli\nmox.cmd" + '" . src\app.js --userdir "' + "$root\u d" + '" -J-Xmx1g "src\' + $odd + '""'
          Start-Process -FilePath cmd.exe -ArgumentList $line -WorkingDirectory "$root\proj dir" -Wait -NoNewWindow
          for ($i = 0; $i -lt 100 -and -not (Test-Path $record); $i++) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $record)) { throw "nmox.cmd never started the launcher" }
          $got = @(Get-Content -LiteralPath $record)
          $want = @("$root\proj dir", '--aim', "$root\proj dir", '--open', "$root\proj dir\src\app.js",
                    '--userdir', "$root\u d", '-J-Xmx1g', '--open', "$root\proj dir\src\$odd")
          Write-Host "launcher saw:"; $got | ForEach-Object { Write-Host "  [$_]" }
          if (($got -join "`n") -ne ($want -join "`n")) { throw "nmox.cmd handed the launcher the wrong argv" }
          # code -g's habit: NAME:LINE[:COL] naming an existing file opens it
          # at the line (the column dropped, the platform's --open has none),
          # -g itself dropped, an explicit --open's value kept as typed
          Remove-Item $record
          $line = '/c ""' + "$root\cli\nmox.cmd" + '" -g src\app.js:42:7 --open "src\' + $odd + ':9:1" "src\' + $odd + ':3""'
          Start-Process -FilePath cmd.exe -ArgumentList $line -WorkingDirectory "$root\proj dir" -Wait -NoNewWindow
          for ($i = 0; $i -lt 100 -and -not (Test-Path $record); $i++) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $record)) { throw "nmox.cmd never started the launcher for NAME:LINE" }
          $got = @(Get-Content -LiteralPath $record)
          $want = @("$root\proj dir", '--open', "$root\proj dir\src\app.js:42", '--open', "src\$($odd):9",
                    '--open', "$root\proj dir\src\$($odd):3")
          Write-Host "launcher saw:"; $got | ForEach-Object { Write-Host "  [$_]" }
          if (($got -join "`n") -ne ($want -join "`n")) { throw "nmox.cmd handed the launcher the wrong argv for NAME:LINE" }
          # --help, -h and /? print the usage on stdout, exit 0, start nothing
          $out = Join-Path $root 'out.txt'
          foreach ($flag in @('--help', '-h', '/?')) {
            Remove-Item $record -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath cmd.exe -ArgumentList ('/c ""' + "$root\cli\nmox.cmd" + '" . ' + $flag + '"') `
                   -WorkingDirectory "$root\proj dir" -Wait -NoNewWindow -PassThru -RedirectStandardOutput $out
            $said = [string](Get-Content -Raw $out)
            Write-Host "nmox $flag -> exit $($p.ExitCode)"; Write-Host $said
            if ($p.ExitCode -ne 0) { throw "nmox $flag exited $($p.ExitCode), not 0" }
            if (-not $said.StartsWith('Usage: nmox [options] [folder | file[:line[:column]]]...')) { throw "nmox $flag printed no usage" }
            if (-not $said.Contains('as File > Open Folder... does')) { throw "nmox $flag mangled the usage: $said" }
            Start-Sleep -Seconds 2
            if (Test-Path $record) { throw "nmox $flag started the launcher" }
          }
          $err = Join-Path $root 'err.txt'
          foreach ($case in @(@('missing.txt', 'nmox: missing.txt: no such file or folder'),
                              @('--aim gone', 'nmox: gone: no such file or folder'),
                              @('--aim src\app.js', 'nmox: src\app.js: not a folder'),
                              @('gone.js:4', 'nmox: gone.js:4: no such file or folder'),
                              @('src:4', 'nmox: src:4: no such file or folder'),
                              @('src\app.js:12345678901', 'nmox: src\app.js:12345678901: no such file or folder'))) {
            Remove-Item $record -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath cmd.exe -ArgumentList ('/c ""' + "$root\cli\nmox.cmd" + '" ' + $case[0] + '"') `
                   -WorkingDirectory "$root\proj dir" -Wait -NoNewWindow -PassThru -RedirectStandardError $err
            $said = [string](Get-Content -Raw $err)
            Write-Host "nmox $($case[0]) -> exit $($p.ExitCode): $said"
            if ($p.ExitCode -ne 2) { throw "nmox $($case[0]) exited $($p.ExitCode), not 2" }
            if (-not $said.Contains($case[1])) { throw "nmox $($case[0]) said [$said], not [$($case[1])]" }
            Start-Sleep -Seconds 2
            if (Test-Path $record) { throw "nmox $($case[0]) started the launcher it refused" }
          }

  # The one place the Windows half of WebKitTextPath is exercised for real:
  # the library path inside a linked runtime, the exported setter, the
  # offsets and the foreign-function call. v2.172.0 shipped a path that
  # never existed in an image (jlink files a jmod's .dll under bin/javafx,
  # not bin/), and every other test passed. Mirrors release.yml's runtime
  # step; the same test runs on macOS against the installed app's runtime.
  webkit-text-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
          cache: maven

      - name: Build the ui module
        run: mvn -B -pl core,ui -am install -DskipTests

      - name: Link a runtime with OpenJFX, as the release does
        shell: pwsh
        run: |
          $fxVersion = "26.0.2"
          $fxSha256 = "8554a293273eac20d172c18455fcf154a54b7879d3f00de28344ebefd8978672"
          $fxZip = "$env:RUNNER_TEMP\openjfx-jmods.zip"
          $attempt = 0
          while ($true) {
            $attempt++
            try {
              Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/$fxVersion/openjfx-${fxVersion}_windows-x64_bin-jmods.zip" -OutFile $fxZip
              break
            } catch {
              if ($attempt -ge 5) { throw "OpenJFX jmods download failed after $attempt attempts: $_" }
              Start-Sleep -Seconds 3
            }
          }
          $actual = (Get-FileHash $fxZip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $fxSha256) { throw "OpenJFX jmods sha256 mismatch: $actual" }
          Expand-Archive $fxZip -DestinationPath "$env:RUNNER_TEMP\openjfx"
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods;$env:RUNNER_TEMP\openjfx\javafx-jmods-$fxVersion" `
            --add-modules ALL-MODULE-PATH `
            --strip-debug --no-header-files --no-man-pages `
            --output "$env:RUNNER_TEMP\jre"
          if (-not (Test-Path "$env:RUNNER_TEMP\jre\bin\javafx\jfxwebkit.dll")) {
            throw "linked runtime has no bin/javafx/jfxwebkit.dll — the path WebKitTextPath looks in"
          }

      - name: Switch WebKit's text path on in that runtime
        shell: pwsh
        # every -D quoted whole: PowerShell splits an unquoted -Dsurefire.foo=bar at
        # the dot and hands maven ".foo=bar" as a lifecycle phase. And the runtime path
        # is $env:RUNNER_TEMP, not %RUNNER_TEMP% — this job's shell is PowerShell, so
        # the cmd form arrived at maven literally.
        run: |
          mvn -B -pl ui surefire:test "-Dtest=WebKitTextPathLiveTest" `
            "-Dsurefire.failIfNoSpecifiedTests=true" "-Dnmox.webkit.live=true" `
            "-Djvm=$env:RUNNER_TEMP\jre\bin\java.exe" `
            "-DargLine=--enable-native-access=ALL-UNNAMED"
