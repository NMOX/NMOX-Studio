# Keeps NMOX Studio's dependencies and CI actions current and patched.
# Security updates land regardless; this adds scheduled version updates,
# grouped to keep the PR volume sane. (Project-template npm pins live in
# rack ProjectTemplates.java string literals — invisible to Dependabot,
# kept current by the v1.237.0-style live npm proofs instead.)
version: 2
updates:
  # The Maven reactor (NetBeans Platform, JUnit/AssertJ/Mockito, plugins).
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # The org.openjfx deps in ui/pom.xml are PROVIDED-scope compile-time
      # halves of the FX runtime that the release workflow jlinks from
      # sha256-pinned jmods (v1.199.0). Bumping the pom alone compiles
      # against a newer FX API than the app ships — skew no CI lane can
      # see, because tests run with the maven dep, not the jlinked
      # runtime. An FX upgrade moves BOTH pins together as its own
      # browser-gauntleted release (tech-debt ledger 74).
      - dependency-name: "org.openjfx:*"
      # slf4j-api is the v2.21.6 OSGi-placement pin: jgit imports
      # org.slf4j [1.7.0,3.0.0) and this ONE explicit dependency is what
      # makes the platform wrap it as a bundle on RELEASE300 AND 310. A
      # 1.7→2.x major swaps the binding mechanism (static binder →
      # ServiceLoader); whether the wrapped 2.x bundle still satisfies
      # jgit under Netigso is a BOOT question no CI lane answers — the
      # bump is its own boot-gauntleted release, never a group ride-along
      # (the org.openjfx precedent above).
      - dependency-name: "org.slf4j:slf4j-api"
      # The NetBeans Platform version is the product's FOUNDATION, not a
      # dependency: the release assembles the whole platform cluster at
      # this version, and the codebase carries decompiled-behavior
      # assumptions pinned against it (LSPBindings' instance-keyed
      # server reuse and MultiMime handling — ledger 83; the rename
      # refactoring collecting every binding's edits — ledger 81; the
      # autoupdate catalog resolution — v1.51.0; FileElement$Type.accept
      # — v1.217.0). A platform major rides its own dossier-first
      # upgrade project with those assumptions re-verified against the
      # new jars and the full gauntlet rerun (tech-debt ledger 84),
      # never a grouped deps PR.
      - dependency-name: "org.netbeans.api:*"
      - dependency-name: "org.netbeans.modules:*"
      - dependency-name: "org.netbeans.cluster:*"

  # The GitHub Actions used by the build/release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
