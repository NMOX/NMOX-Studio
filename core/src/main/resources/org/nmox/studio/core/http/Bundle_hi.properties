HttpBodies.stalled=सर्वर ने {0} बाइट के बाद भेजना बंद कर दिया ({1} सेकंड प्रतीक्षा की)
HttpBodies.brokenOf={1} में से {0} बाइट के बाद कनेक्शन बंद हो गया
HttpBodies.broken={0} बाइट के बाद कनेक्शन बंद हो गया, सामग्री पूरी होने से पहले
HttpBodies.tooSlow={1} सेकंड बाद भी सामग्री आ रही थी (अब तक {0} बाइट), इतनी धीमी कि और इंतज़ार नहीं किया गया
