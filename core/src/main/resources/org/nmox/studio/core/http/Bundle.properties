# The one capped, deadline-bounded HTTP-body read (HttpBodies).
# {0} = body bytes that arrived before the server went quiet, {1} = the deadline in seconds.
HttpBodies.stalled=the server stopped sending after {0} bytes (waited {1} s)
HttpBodies.brokenOf=the connection closed after {0} of {1} bytes
HttpBodies.broken=the connection closed after {0} bytes, before the body was complete
