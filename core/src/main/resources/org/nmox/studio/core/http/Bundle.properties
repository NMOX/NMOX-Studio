# The one capped, deadline-bounded HTTP-body read (HttpBodies).
# {0} = body bytes that arrived before the server went quiet, {1} = the deadline in seconds.
HttpBodies.stalled=the server stopped sending after {0,choice,0#{0} bytes|1#{0} byte|1<{0} bytes} (waited {1} s)
HttpBodies.brokenOf=the connection closed after {0} of {1,choice,0#{1} bytes|1#{1} byte|1<{1} bytes}
HttpBodies.broken=the connection closed after {0,choice,0#{0} bytes|1#{0} byte|1<{0} bytes}, before the body was complete
HttpBodies.tooSlow=the body was still arriving after {1} s ({0,choice,0#{0} bytes|1#{0} byte|1<{0} bytes} so far), too slowly to wait for
