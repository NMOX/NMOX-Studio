OpenIDE-Module-Long-Description=NMOX Studio की कोर सेवाएँ देता है: प्रोसेस सहायता, एटॉमिक फ़ाइलें, साझा HTTP क्लाइंट, कीचेन में रखे रहस्य, और वह फ़्रीज़ किया गया Device SPI जिसे तीसरे पक्ष के रैक डिवाइस लागू करते हैं।
