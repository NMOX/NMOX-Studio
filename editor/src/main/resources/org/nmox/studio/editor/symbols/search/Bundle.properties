# Quick Search into the file being edited (VS Code's Go to Symbol in Editor).
#
# The first key is the Quick Search category's name: the layer names this
# bundle as the QuickSearch/FileSymbols folder's localizing bundle.
QuickSearch/FileSymbols=Symbols in This File
CTL_GoToSymbolInFile=Go to Symbol in This File…
# {0} - the symbol's name, as the file writes it
# {1} - its line number
FileSymbols_row={0} — line {1}
# {0} - the symbol's name, as the file writes it
# {1} - what the outline adds to the name: a route's target, a test's suite
# {2} - its line number
FileSymbols_rowDetail={0} {1} — line {2}
# {0} - the line number the symbol was on when the search ran
FileSymbols_gone=The file changed since the search: line {0} is no longer there
GoToSymbolInFile_noQuickSearch=Go to Symbol in This File needs Quick Search on the toolbar: it types @ there
