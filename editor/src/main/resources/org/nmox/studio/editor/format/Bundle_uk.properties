CTL_FormatWithPrettier=Форматувати за допомогою Prettier
FormatOnSave_detail=<html><i>Виконується лише в проєктах, які обрали Prettier — файл .prettierrc / prettier.config або package.json, що згадує prettier. Власний node_modules/.bin/prettier проєкту має перевагу над глобальним встановленням. Файли, які не вдалося відформатувати, зберігаються без змін.</i></html>
FormatOnSave_DisplayName=Форматувати під час збереження
FormatOnSave_enabled=Форматувати файли за допомогою Prettier під час збереження
FormatOnSave_Keywords=форматування збереження prettier форматувальник
FormatWithPrettierAction_alreadyFormatted=Вже відформатовано.
FormatWithPrettierAction_changed=Документ змінився під час форматування — запустіть ще раз.
FormatWithPrettierAction_couldNotApply=Не вдалося застосувати відформатований текст.
FormatWithPrettierAction_failed=Prettier не зміг відформатувати цей файл (синтаксична помилка?).
FormatWithPrettierAction_formatted=Відформатовано за допомогою Prettier.
FormatWithPrettierAction_formattedDefaults=Відформатовано типовими налаштуваннями Prettier — у проєкті немає конфігурації Prettier.
FormatWithPrettierAction_noBuffer=Немає буфера редактора для форматування.
FormatWithPrettierAction_noPrettier=Prettier не знайдено — встановіть його у проєкті або глобально в PATH.
FormatWithPrettierAction_tooLarge=Файл завеликий для Prettier — тут теж діє обмеження розміру збереження.
