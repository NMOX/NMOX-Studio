FormatOnSave_detail=<html><i>Tumatakbo lamang sa mga proyektong pumiling gumamit ng Prettier — isang .prettierrc / prettier.config file o isang package.json na bumabanggit sa prettier. Mas pinipili ang sariling node_modules/.bin/prettier ng proyekto kaysa sa global na install. Ang mga file na nabigong ma-format ay nase-save nang walang pagbabago.</i></html>
