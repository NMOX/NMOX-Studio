CTL_FormatWithPrettier=Formatear con Prettier
FormatOnSave_detail=<html><i>Solo se ejecuta en proyectos que han optado por Prettier — un archivo .prettierrc / prettier.config o un package.json que mencione prettier. Se prefiere el node_modules/.bin/prettier del propio proyecto antes que una instalación global. Los archivos que no se pueden formatear se guardan sin cambios.</i></html>
FormatOnSave_DisplayName=Formatear al guardar
FormatOnSave_enabled=Formatear los archivos con Prettier al guardar
FormatOnSave_Keywords=formatear guardar prettier formateador
FormatWithPrettierAction_alreadyFormatted=Ya está formateado.
FormatWithPrettierAction_changed=El documento cambió durante el formateo — vuelve a ejecutarlo.
FormatWithPrettierAction_couldNotApply=No se pudo aplicar el texto formateado.
FormatWithPrettierAction_failed=Prettier no pudo formatear este archivo (¿error de sintaxis?).
FormatWithPrettierAction_formatted=Formateado con Prettier.
FormatWithPrettierAction_formattedDefaults=Formateado con los valores por defecto de Prettier — el proyecto no tiene configuración de Prettier.
FormatWithPrettierAction_noBuffer=No hay ningún búfer de editor que formatear.
FormatWithPrettierAction_noPrettier=Prettier no encontrado — instálalo en el proyecto o globalmente en el PATH.
FormatWithPrettierAction_tooLarge=Archivo demasiado grande para Prettier — aquí también se aplica el límite de tamaño al guardar.
