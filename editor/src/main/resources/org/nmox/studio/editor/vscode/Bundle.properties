# Tools > Import VS Code Settings: a switcher's own VS Code preferences,
# read once on request. Pure ASCII: non-ASCII characters are escaped.
# No value with a {0} carries an ASCII apostrophe (MessageFormat eats it).

CTL_ImportVsCodeSettings=Import VS Code Settings…

ImportVsCode_title=Import VS Code Settings
# {0} - which VS Code build (VS Code, VS Code Insiders, VSCodium); {1} - the settings file read
ImportVsCode_heading=Read from {0}: {1}
ImportVsCode_intro=Checked settings are written to NMOX Studio when you press Apply, and take effect at once. Unchecked rows do something close to, but not the same as, what they did in VS Code: each says how. Keyboard shortcuts live in keybindings.json, which is not read: the Keymap settings hold the profiles.
# {0} - how many settings in the file this does not recognise (their names and values are never shown)
ImportVsCode_others={0,choice,0#Nothing else in the file was read.|1#One other setting in the file has no place here; it is not shown.|1<{0,number,integer} other settings in the file have no place here; they are not shown.}
ImportVsCode_source=Settings file:
ImportVsCode_sourceName=Which VS Code settings file to read
ImportVsCode_colImport=Import
ImportVsCode_colSetting=VS Code setting
ImportVsCode_colValue=Value
ImportVsCode_colHere=In NMOX Studio
ImportVsCode_tableName=VS Code settings to import
ImportVsCode_apply=Apply
ImportVsCode_cancel=Cancel
# {0} - the places looked in, separated by commas
ImportVsCode_notFound=No VS Code settings file was found. Looked in: {0}
# {0} - the settings file
ImportVsCode_tooLarge={0} is larger than a settings file can be; nothing was imported
# {0} - the settings file
ImportVsCode_unreadable={0} could not be read as JSON with comments; nothing was imported
# {0} - the settings file
ImportVsCode_nothing=Nothing in {0} has a place in NMOX Studio
# {0} - how many settings were written
ImportVsCode_applied={0,choice,0#No VS Code settings were applied|1#Applied 1 VS Code setting|1<Applied {0,number,integer} VS Code settings}
# {0} - the sentence saying what was applied; {1} - the settings that could not be, by key
ImportVsCode_failed={0}. Not applied: {1}

# What each recognised setting becomes here.
# {0} - a font family installed on this machine
Here_font=Not set here: the editor font is chosen in the Fonts & Colors settings ({0} is installed on this machine)
Here_fontNone=Not set here: the editor font is chosen in the Fonts & Colors settings (none of these fonts is installed on this machine)
Here_fonts=Not set here: the editor font and its size are chosen in the Fonts & Colors settings
# {0} - a width in columns
Here_tab=Tab width and indentation {0,choice,1#1 column|1<{0,number,integer} columns}, every language (a project .editorconfig or .vscode/settings.json still wins)
# {0} - a width in columns
Here_tabOnly=Tab width {0,choice,1#1 column|1<{0,number,integer} columns}, every language (a project .editorconfig or .vscode/settings.json still wins)
# {0} - a width in columns
Here_indent=Indentation {0,choice,1#1 column|1<{0,number,integer} columns}, every language (a project .editorconfig or .vscode/settings.json still wins)
Here_spaces=Indent with spaces, every language (a project .editorconfig or .vscode/settings.json still wins)
Here_tabs=Indent with tabs, every language (a project .editorconfig or .vscode/settings.json still wins)
Here_detect=Not set here: indentation is what the settings say, and a file’s own content does not override it
Here_wrapOn=Soft wrap at words, in every language you have not set apart with the Word Wrap toggle
Here_wrapOff=No soft wrap, in every language you have not set apart with the Word Wrap toggle
Here_wrapColumn=Not set here: wrapping at a column has no counterpart; wrap here is on or off
# {0} - a column
Here_ruler=Right margin line at column {0}
# {0} - a column; {1} - how many rulers the setting lists
Here_rulerFirst=Right margin line at column {0}: one line is shown here, the first of {1,choice,1#1 ruler|1<{1,number,integer} rulers}
Here_rulerOff=No right margin line
Here_whitespaceOff=Whitespace characters hidden
Here_whitespaceAll=Whitespace characters shown (here this also shows line ends)
Here_whitespaceSome=Not set here: whitespace is shown everywhere or nowhere, never only in some places
Here_formatOn=Format on Save on (it formats with the project Prettier configuration)
Here_formatOff=Format on Save off
Here_minimapOn=Minimap shown
Here_minimapOff=Minimap hidden
Here_stickyOn=Sticky Scroll shown
Here_stickyOff=Sticky Scroll hidden
Here_autoSaveOff=Autosave off, and no saving when an editor loses focus
Here_autoSaveFocus=Save when an editor loses focus; no timed autosave
Here_autoSaveWindow=Save when an editor loses focus (VS Code waited for the window to lose focus; this also saves when you move to another panel)
# {0} - minutes
Here_autoSaveMinutes=Autosave every {0,choice,1#minute|1<{0,number,integer} minutes}
# {0} - milliseconds
Here_autoSaveDelay=Autosave on, at its own interval in whole minutes (VS Code saved {0,number,#} ms after a change; nothing here saves that soon)
Here_delayAlone=Not set here: the delay matters only when files.autoSave is afterDelay
Here_trimOn=Remove trailing whitespace on save, every language
Here_trimOff=Leave trailing whitespace alone on save, every language
Here_repositoryOnly=Not set here: there is no personal setting for this; a repository .editorconfig or .vscode/settings.json is honoured on save
Here_oneLook=Not set here: NMOX Studio has one look
Here_terminal=Not imported: the Terminal keeps its own settings, and these values are not shown
Here_invalid=Not set here: the value is not one this setting takes
# {0} - how many terminal settings the file holds (their values are never shown)
Value_count={0,choice,1#1 setting|1<{0,number,integer} settings}, values not shown
