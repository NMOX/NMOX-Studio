Here_font=Não definido aqui: a fonte do editor é escolhida nas configurações de Fontes e cores ({0} está instalada nesta máquina)
Here_fontNone=Não definido aqui: a fonte do editor é escolhida nas configurações de Fontes e cores (nenhuma destas fontes está instalada nesta máquina)
Here_fonts=Não definido aqui: a fonte do editor e o tamanho dela são escolhidos nas configurações de Fontes e cores
Here_tab=Largura da tabulação e indentação de {0,choice,1#1 coluna|1<{0,number,integer} colunas}, em todas as linguagens (um .editorconfig ou .vscode/settings.json do projeto continua vencendo)
Here_tabOnly=Largura da tabulação de {0,choice,1#1 coluna|1<{0,number,integer} colunas}, em todas as linguagens (um .editorconfig ou .vscode/settings.json do projeto continua vencendo)
Here_indent=Indentação de {0,choice,1#1 coluna|1<{0,number,integer} colunas}, em todas as linguagens (um .editorconfig ou .vscode/settings.json do projeto continua vencendo)
Here_spaces=Indentar com espaços, em todas as linguagens (um .editorconfig ou .vscode/settings.json do projeto continua vencendo)
Here_tabs=Indentar com tabulações, em todas as linguagens (um .editorconfig ou .vscode/settings.json do projeto continua vencendo)
Here_detect=Não definido aqui: a indentação é a que as configurações dizem, e o próprio conteúdo de um arquivo não a substitui
Here_wrapOn=Quebra automática nas palavras, em toda linguagem que você não deixou à parte com a opção Quebra automática de linha
Here_wrapOff=Sem quebra automática, em toda linguagem que você não deixou à parte com a opção Quebra automática de linha
Here_wrapColumn=Não definido aqui: quebrar numa coluna não tem equivalente; aqui a quebra está ligada ou desligada
Here_ruler=Linha da margem direita na coluna {0}
Here_rulerFirst=Linha da margem direita na coluna {0}: aqui aparece uma linha só, a primeira de {1,choice,1#1 régua|1<{1,number,integer} réguas}
Here_rulerOff=Sem linha de margem direita
Here_whitespaceOff=Caracteres de espaço em branco ocultos
Here_whitespaceAll=Caracteres de espaço em branco visíveis (aqui isso também mostra os fins de linha)
Here_whitespaceSome=Não definido aqui: o espaço em branco aparece em todo lugar ou em nenhum, nunca só em alguns lugares
Here_formatOn=Formatar ao salvar ligado (formata com a configuração do Prettier do projeto)
Here_formatOff=Formatar ao salvar desligado
Here_minimapOn=Minimapa visível
Here_minimapOff=Minimapa oculto
Here_stickyOn=Rolagem fixa visível
Here_stickyOff=Rolagem fixa oculta
Here_autoSaveOff=Salvamento automático desligado, e nada é salvo quando um editor perde o foco
Here_autoSaveFocus=Salvar quando um editor perde o foco; sem salvamento automático por tempo
Here_autoSaveWindow=Salvar quando um editor perde o foco (o VS Code esperava a janela perder o foco; aqui também salva quando você passa para outro painel)
Here_autoSaveMinutes=Salvamento automático a cada {0,choice,1#minuto|1<{0,number,integer} minutos}
Here_autoSaveDelay=Salvamento automático ligado, no intervalo próprio dele, em minutos inteiros (o VS Code salvava {0,number,#} ms depois de uma alteração; nada aqui salva tão cedo)
Here_delayAlone=Não definido aqui: o atraso só importa quando files.autoSave é afterDelay
Here_trimOn=Remover os espaços em branco do fim das linhas ao salvar, em todas as linguagens
Here_trimOff=Deixar como estão os espaços em branco do fim das linhas ao salvar, em todas as linguagens
Here_repositoryOnly=Não definido aqui: não há uma configuração pessoal para isso; um .editorconfig ou .vscode/settings.json do repositório é respeitado ao salvar
Here_oneLook=Não definido aqui: o NMOX Studio tem uma única aparência
Here_terminal=Não importado: o Terminal mantém as próprias configurações, e esses valores não são mostrados
Here_invalid=Não definido aqui: o valor não é um dos que esta configuração aceita
Value_count={0,choice,1#1 configuração|1<{0,number,integer} configurações}, valores não mostrados
