ImportVsCode_title=Importar configurações do VS Code
ImportVsCode_heading=Lido de {0}: {1}
ImportVsCode_intro=As configurações marcadas são gravadas no NMOX Studio quando você aperta Aplicar, e valem na hora. As linhas desmarcadas fazem algo parecido, mas não igual, ao que faziam no VS Code: cada uma diz como. Os atalhos de teclado ficam no keybindings.json, que não é lido: as configurações de Atalhos de teclado guardam os perfis.
ImportVsCode_others={0,choice,0#Nada mais do arquivo foi lido.|1#Uma outra configuração do arquivo não tem lugar aqui; ela não é mostrada.|1<{0,number,integer} outras configurações do arquivo não têm lugar aqui; elas não são mostradas.}
