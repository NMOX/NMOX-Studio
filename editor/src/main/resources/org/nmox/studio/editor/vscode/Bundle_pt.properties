ImportVsCode_apply=Aplicar
ImportVsCode_cancel=Cancelar
ImportVsCode_notFound=Nenhum arquivo de configurações do VS Code foi encontrado. Procurado em: {0}
ImportVsCode_tooLarge={0} é maior do que um arquivo de configurações pode ser; nada foi importado
