CTL_ImportVsCodeSettings=Importar ajustes de VS Code…
ImportVsCode_title=Importar ajustes de VS Code
ImportVsCode_heading=Leído de {0}: {1}
ImportVsCode_intro=Los ajustes marcados se escriben en NMOX Studio al pulsar Aplicar, y surten efecto en el acto. Las filas sin marcar hacen algo parecido a lo que hacían en VS Code, pero no lo mismo: cada una dice en qué. Los atajos de teclado están en keybindings.json, que no se lee: los perfiles están en los ajustes de Atajos de teclado.
ImportVsCode_others={0,choice,0#No se leyó nada más del archivo.|1#Otro ajuste del archivo no tiene lugar aquí; no se muestra.|1<Otros {0,number,integer} ajustes del archivo no tienen lugar aquí; no se muestran.}
ImportVsCode_source=Archivo de ajustes:
ImportVsCode_sourceName=Qué archivo de ajustes de VS Code leer
ImportVsCode_colImport=Importar
ImportVsCode_colSetting=Ajuste de VS Code
ImportVsCode_colValue=Valor
ImportVsCode_colHere=En NMOX Studio
ImportVsCode_tableName=Ajustes de VS Code que importar
ImportVsCode_apply=Aplicar
ImportVsCode_cancel=Cancelar
ImportVsCode_notFound=No se encontró ningún archivo de ajustes de VS Code. Se buscó en: {0}
ImportVsCode_tooLarge={0} es más grande de lo que puede ser un archivo de ajustes; no se importó nada
ImportVsCode_unreadable={0} no se pudo leer como JSON con comentarios; no se importó nada
ImportVsCode_nothing=Nada de {0} tiene lugar en NMOX Studio
ImportVsCode_applied={0,choice,0#No se aplicó ningún ajuste de VS Code|1#Se aplicó 1 ajuste de VS Code|1<Se aplicaron {0,number,integer} ajustes de VS Code}
ImportVsCode_failed={0}. No se aplicaron: {1}
Here_font=No se fija aquí: la fuente del editor se elige en los ajustes de Fuentes y colores ({0} está instalada en esta máquina)
Here_fontNone=No se fija aquí: la fuente del editor se elige en los ajustes de Fuentes y colores (ninguna de estas fuentes está instalada en esta máquina)
Here_fonts=No se fija aquí: la fuente del editor y su tamaño se eligen en los ajustes de Fuentes y colores
Here_tab=Ancho de tabulación y sangría de {0,choice,1#1 columna|1<{0,number,integer} columnas}, en todos los lenguajes (un .editorconfig o un .vscode/settings.json del proyecto sigue mandando)
Here_tabOnly=Ancho de tabulación de {0,choice,1#1 columna|1<{0,number,integer} columnas}, en todos los lenguajes (un .editorconfig o un .vscode/settings.json del proyecto sigue mandando)
Here_indent=Sangría de {0,choice,1#1 columna|1<{0,number,integer} columnas}, en todos los lenguajes (un .editorconfig o un .vscode/settings.json del proyecto sigue mandando)
Here_spaces=Sangrar con espacios, en todos los lenguajes (un .editorconfig o un .vscode/settings.json del proyecto sigue mandando)
Here_tabs=Sangrar con tabuladores, en todos los lenguajes (un .editorconfig o un .vscode/settings.json del proyecto sigue mandando)
Here_detect=No se fija aquí: la sangría es la que dicen los ajustes, y el contenido de un archivo no la sustituye
Here_wrapOn=Ajuste de línea por palabras, en todos los lenguajes que no hayas apartado con el interruptor Ajuste de línea
Here_wrapOff=Sin ajuste de línea, en todos los lenguajes que no hayas apartado con el interruptor Ajuste de línea
Here_wrapColumn=No se fija aquí: ajustar en una columna no tiene equivalente; aquí el ajuste de línea está activado o desactivado
Here_ruler=Línea de margen derecho en la columna {0}
Here_rulerFirst=Línea de margen derecho en la columna {0}: aquí se muestra una sola línea, la primera de {1,choice,1#1 regla|1<{1,number,integer} reglas}
Here_rulerOff=Sin línea de margen derecho
Here_whitespaceOff=Caracteres de espacio en blanco ocultos
Here_whitespaceAll=Caracteres de espacio en blanco visibles (aquí esto también muestra los finales de línea)
Here_whitespaceSome=No se fija aquí: los espacios en blanco se muestran en todas partes o en ninguna, nunca solo en algunos sitios
Here_formatOn=Formatear al guardar, activado (formatea con la configuración de Prettier del proyecto)
Here_formatOff=Formatear al guardar, desactivado
Here_minimapOn=Minimapa visible
Here_minimapOff=Minimapa oculto
Here_stickyOn=Desplazamiento fijo visible
Here_stickyOff=Desplazamiento fijo oculto
Here_autoSaveOff=Guardado automático desactivado, y no se guarda cuando un editor pierde el foco
Here_autoSaveFocus=Guardar cuando un editor pierde el foco; sin guardado automático periódico
Here_autoSaveWindow=Guardar cuando un editor pierde el foco (VS Code esperaba a que la ventana perdiera el foco; esto también guarda cuando pasas a otro panel)
Here_autoSaveMinutes=Guardado automático cada {0,choice,1#minuto|1<{0,number,integer} minutos}
Here_autoSaveDelay=Guardado automático activado, con su propio intervalo en minutos enteros (VS Code guardaba {0,number,#} ms después de un cambio; aquí nada guarda tan pronto)
Here_delayAlone=No se fija aquí: el retardo solo cuenta cuando files.autoSave es afterDelay
Here_trimOn=Quitar los espacios en blanco finales al guardar, en todos los lenguajes
Here_trimOff=Dejar como están los espacios en blanco finales al guardar, en todos los lenguajes
Here_repositoryOnly=No se fija aquí: no hay ningún ajuste personal para esto; al guardar se respeta el .editorconfig o el .vscode/settings.json de un repositorio
Here_oneLook=No se fija aquí: NMOX Studio tiene un solo aspecto
Here_terminal=No se importa: la Terminal conserva sus propios ajustes, y estos valores no se muestran
Here_invalid=No se fija aquí: el valor no es uno de los que admite este ajuste
Value_count={0,choice,1#1 ajuste|1<{0,number,integer} ajustes}, valores sin mostrar
