CTL_FormatWithPrettier=使用 Prettier 格式化
FormatOnSave_detail=<html><i>仅在选用了 Prettier 的项目中运行 — 即含有 .prettierrc / prettier.config 文件，或 package.json 中提到 prettier。优先使用项目自带的 node_modules/.bin/prettier，而非全局安装。格式化失败的文件将原样保存。</i></html>
FormatOnSave_DisplayName=保存时格式化
FormatOnSave_enabled=保存时使用 Prettier 格式化文件
FormatOnSave_Keywords=格式化 保存 prettier 格式化工具 format save
FormatWithPrettierAction_alreadyFormatted=已经格式化。
FormatWithPrettierAction_changed=格式化期间文档已更改 — 请重新运行。
FormatWithPrettierAction_couldNotApply=无法应用格式化后的文本。
FormatWithPrettierAction_failed=Prettier 无法格式化此文件（语法错误？）。
FormatWithPrettierAction_formatted=已使用 Prettier 格式化。
FormatWithPrettierAction_formattedDefaults=已使用 Prettier 默认设置格式化 — 本项目没有 Prettier 配置。
FormatWithPrettierAction_noBuffer=没有可格式化的编辑器缓冲区。
FormatWithPrettierAction_noPrettier=未找到 Prettier — 请在项目中安装，或全局安装到 PATH 上。
FormatWithPrettierAction_tooLarge=文件过大，Prettier 无法处理 — 此处同样适用保存大小上限。
