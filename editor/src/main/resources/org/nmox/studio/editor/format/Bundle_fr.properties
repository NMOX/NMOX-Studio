CTL_FormatWithPrettier=Formater avec Prettier
FormatOnSave_detail=<html><i>Ne s'exécute que dans les projets qui ont adopté Prettier — un fichier .prettierrc / prettier.config ou un package.json qui mentionne prettier. Le node_modules/.bin/prettier du projet est préféré à une installation globale. Les fichiers dont le formatage échoue sont enregistrés inchangés.</i></html>
FormatOnSave_DisplayName=Formater à l'enregistrement
FormatOnSave_enabled=Formater les fichiers avec Prettier à l'enregistrement
FormatOnSave_Keywords=formater enregistrement prettier formateur format save formatter
FormatWithPrettierAction_alreadyFormatted=Déjà formaté.
FormatWithPrettierAction_changed=Le document a changé pendant le formatage — relancez-le.
FormatWithPrettierAction_couldNotApply=Impossible d'appliquer le texte formaté.
FormatWithPrettierAction_failed=Prettier n'a pas pu formater ce fichier (erreur de syntaxe ?).
FormatWithPrettierAction_formatted=Formaté avec Prettier.
FormatWithPrettierAction_formattedDefaults=Formaté avec les réglages par défaut de Prettier — le projet n'a aucune configuration Prettier.
FormatWithPrettierAction_noBuffer=Aucun tampon d'éditeur à formater.
FormatWithPrettierAction_noPrettier=Prettier introuvable — installez-le dans le projet ou globalement dans le PATH.
FormatWithPrettierAction_tooLarge=Fichier trop volumineux pour Prettier — la limite de taille à l'enregistrement s'applique aussi ici.
