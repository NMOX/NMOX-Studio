# The editing gestures a VS Code user's hands reach for.
#
# A key named after an action is its display name: the
# @EditorActionRegistration processor resolves it from this package's
# bundle, and Quick Search shows it beside VS Code's own title.
nmox-toggle-block-comment=Toggle Block Comment
nmox-expand-line-selection=Expand Line Selection

BlockComment_none=This language has no block comment
# {0} - the delimiter found inside the range, as the file writes it: */ or --> or </script>
BlockComment_contains=Toggle Block Comment: the range already contains {0}, so a comment around it would end early or swallow what follows
BlockComment_tooLarge=Toggle Block Comment: the selection is too large to check for comment delimiters
BlockComment_readOnly=Toggle Block Comment: this editor is read-only
BlockComment_failed=Toggle Block Comment: the text changed before the comment could be written; nothing was changed
