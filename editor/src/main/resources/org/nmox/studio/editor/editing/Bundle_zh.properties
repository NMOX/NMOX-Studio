nmox-toggle-block-comment=切换块注释
nmox-expand-line-selection=展开行选择
nmox-toggle-word-wrap=切换自动换行
BlockComment_none=这种语言没有块注释
BlockComment_contains=切换块注释：所选范围内已经含有 {0}，套在外面的注释会提前结束，或者把后面的内容一并吞掉
BlockComment_tooLarge=切换块注释：选区过大，无法检查其中的注释定界符
BlockComment_readOnly=切换块注释：此编辑器为只读
BlockComment_failed=切换块注释：注释还没写入，文本就已发生变化；未做任何更改
CTL_ToggleWordWrap=自动换行
WordWrap_tip=在当前文件所属语言的每个编辑器中让长行自动换行；这一选择会被保存
WordWrap_on=已为所有 {0} 编辑器开启自动换行
WordWrap_off=已为所有 {0} 编辑器关闭自动换行
WordWrap_unchanged=自动换行没有改变：此文件的换行方式取自其项目自己的格式设置，而不是 {0} 编辑器的设置
WordWrap_noEditor=“自动换行”需要一个代码编辑器：请先在其中点击一下
