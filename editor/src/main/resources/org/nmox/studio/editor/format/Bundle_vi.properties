CTL_FormatWithPrettier=Định dạng bằng Prettier
FormatOnSave_detail=<html><i>Chỉ chạy trong các dự án đã chọn dùng Prettier — có tệp .prettierrc / prettier.config hoặc package.json có nhắc tới prettier. node_modules/.bin/prettier của chính dự án được ưu tiên hơn bản cài toàn cục. Tệp không định dạng được vẫn lưu nguyên vẹn.</i></html>
