CTL_FormatWithPrettier=Форматировать с помощью Prettier
FormatOnSave_detail=<html><i>Работает только в проектах, подключивших Prettier — с файлом .prettierrc / prettier.config или package.json, упоминающим prettier. Собственный node_modules/.bin/prettier проекта предпочтительнее глобальной установки. Файлы, которые не удалось отформатировать, сохраняются без изменений.</i></html>
FormatOnSave_DisplayName=Форматирование при сохранении
FormatOnSave_enabled=Форматировать файлы с помощью Prettier при сохранении
FormatOnSave_Keywords=форматирование сохранение форматтер prettier format save
FormatWithPrettierAction_alreadyFormatted=Уже отформатировано.
FormatWithPrettierAction_changed=Документ изменился во время форматирования — выполните ещё раз.
FormatWithPrettierAction_couldNotApply=Не удалось применить отформатированный текст.
FormatWithPrettierAction_failed=Prettier не смог отформатировать этот файл (синтаксическая ошибка?).
FormatWithPrettierAction_formatted=Отформатировано с помощью Prettier.
FormatWithPrettierAction_formattedDefaults=Отформатировано с настройками Prettier по умолчанию — в проекте нет конфигурации Prettier.
FormatWithPrettierAction_noBuffer=Нет буфера редактора для форматирования.
FormatWithPrettierAction_noPrettier=Prettier не найден — установите его в проекте или глобально в PATH.
FormatWithPrettierAction_tooLarge=Файл слишком велик для Prettier — здесь тоже действует ограничение размера при сохранении.
