CTL_FormatWithPrettier=Formatar com Prettier
FormatOnSave_detail=<html><i>Só é executado em projetos que optaram pelo Prettier — um arquivo .prettierrc / prettier.config ou um package.json que mencione prettier. O node_modules/.bin/prettier do próprio projeto tem preferência sobre uma instalação global. Os arquivos que não puderem ser formatados são salvos sem alterações.</i></html>
FormatOnSave_DisplayName=Formatar ao salvar
FormatOnSave_enabled=Formatar arquivos com Prettier ao salvar
FormatOnSave_Keywords=formatar salvar prettier formatador
FormatWithPrettierAction_alreadyFormatted=Já está formatado.
FormatWithPrettierAction_changed=O documento mudou durante a formatação — execute novamente.
FormatWithPrettierAction_couldNotApply=Não foi possível aplicar o texto formatado.
FormatWithPrettierAction_failed=O Prettier não conseguiu formatar este arquivo (erro de sintaxe?).
FormatWithPrettierAction_formatted=Formatado com Prettier.
FormatWithPrettierAction_formattedDefaults=Formatado com os padrões do Prettier — o projeto não tem configuração do Prettier.
FormatWithPrettierAction_noBuffer=Nenhum buffer de editor para formatar.
FormatWithPrettierAction_noPrettier=Prettier não encontrado — instale-o no projeto ou globalmente no PATH.
FormatWithPrettierAction_tooLarge=Arquivo grande demais para o Prettier — o limite de tamanho ao salvar também vale aqui.
