CTL_ImportVsCodeSettings=I-import ang mga Setting ng VS Code…
ImportVsCode_title=I-import ang mga Setting ng VS Code
ImportVsCode_heading=Binasa mula sa {0}: {1}
ImportVsCode_intro=Isinusulat sa NMOX Studio ang mga setting na may tsek kapag pinindot mo ang Ilapat, at agad itong umiiral. Ang mga hilerang walang tsek ay gumagawa ng bagay na malapit, pero hindi kapareho, sa ginawa nila sa VS Code: sinasabi ng bawat isa kung paano. Nasa keybindings.json ang mga keyboard shortcut, na hindi binabasa: nasa mga setting na Mga keyboard shortcut ang mga profile.
