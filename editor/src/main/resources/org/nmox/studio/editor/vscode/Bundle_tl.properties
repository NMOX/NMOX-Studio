Here_font=Hindi itinatakda rito: pinipili ang font ng editor sa mga setting na Mga font at kulay (naka-install sa makinang ito ang {0})
Here_fontNone=Hindi itinatakda rito: pinipili ang font ng editor sa mga setting na Mga font at kulay (wala sa mga font na ito ang naka-install sa makinang ito)
Here_fonts=Hindi itinatakda rito: pinipili ang font ng editor at ang laki nito sa mga setting na Mga font at kulay
Here_tab=Lapad ng tab at indentation na {0,choice,1#1 column|1<{0,number,integer} column}, sa bawat wika (nananaig pa rin ang .editorconfig o .vscode/settings.json ng isang proyekto)
Here_tabOnly=Lapad ng tab na {0,choice,1#1 column|1<{0,number,integer} column}, sa bawat wika (nananaig pa rin ang .editorconfig o .vscode/settings.json ng isang proyekto)
Here_indent=Indentation na {0,choice,1#1 column|1<{0,number,integer} column}, sa bawat wika (nananaig pa rin ang .editorconfig o .vscode/settings.json ng isang proyekto)
Here_spaces=Mag-indent gamit ang mga espasyo, sa bawat wika (nananaig pa rin ang .editorconfig o .vscode/settings.json ng isang proyekto)
Here_tabs=Mag-indent gamit ang mga tab, sa bawat wika (nananaig pa rin ang .editorconfig o .vscode/settings.json ng isang proyekto)
Here_detect=Hindi itinatakda rito: ang indentation ay ang sinasabi ng mga setting, at hindi ito pinapalitan ng sariling nilalaman ng isang file
Here_wrapOn=Soft wrap sa mga salita, sa bawat wikang hindi mo pa itinakda nang hiwalay gamit ang toggle na Word Wrap
Here_wrapOff=Walang soft wrap, sa bawat wikang hindi mo pa itinakda nang hiwalay gamit ang toggle na Word Wrap
Here_wrapColumn=Hindi itinatakda rito: walang katapat ang pag-wrap sa isang column; naka-on o naka-off lang ang wrap dito
Here_ruler=Linya ng kanang margin sa column na {0}
Here_rulerFirst=Linya ng kanang margin sa column na {0}: isang linya lang ang ipinapakita rito, ang una sa {1,choice,1#1 ruler|1<{1,number,integer} ruler}
Here_rulerOff=Walang linya ng kanang margin
Here_whitespaceOff=Nakatago ang mga whitespace character
Here_whitespaceAll=Ipinapakita ang mga whitespace character (dito, ipinapakita rin nito ang mga dulo ng linya)
Here_whitespaceSome=Hindi itinatakda rito: ipinapakita ang whitespace saanman o hindi kahit saan, hindi kailanman sa ilang lugar lang
Here_formatOn=I-format kapag nag-save: naka-on (nagfo-format ito gamit ang configuration ng Prettier ng proyekto)
Here_formatOff=I-format kapag nag-save: naka-off
Here_minimapOn=Ipinapakita ang Minimap
Here_minimapOff=Nakatago ang Minimap
Here_stickyOn=Ipinapakita ang Sticky scroll
Here_stickyOff=Nakatago ang Sticky scroll
Here_autoSaveOff=Naka-off ang Awtomatikong pag-save, at walang pag-save kapag nawalan ng pokus ang isang editor
Here_autoSaveFocus=Mag-save kapag nawalan ng pokus ang isang editor; walang naka-orasang awtomatikong pag-save
Here_autoSaveWindow=Mag-save kapag nawalan ng pokus ang isang editor (hinintay ng VS Code na mawalan ng pokus ang bintana; dito, nagse-save din ito kapag lumipat ka sa ibang panel)
Here_autoSaveMinutes=Awtomatikong pag-save tuwing {0,choice,1#minuto|1<{0,number,integer} minuto}
Here_autoSaveDelay=Naka-on ang Awtomatikong pag-save, sa sarili nitong pagitan na buong minuto (nag-save ang VS Code {0,number,#} ms pagkatapos ng isang pagbabago; walang nagse-save dito nang ganoon kaaga)
Here_delayAlone=Hindi itinatakda rito: mahalaga lang ang delay kapag afterDelay ang files.autoSave
Here_trimOn=Alisin ang trailing whitespace kapag nag-save, sa bawat wika
Here_trimOff=Hayaan ang trailing whitespace kapag nag-save, sa bawat wika
Here_repositoryOnly=Hindi itinatakda rito: walang personal na setting para rito; sinusunod kapag nag-save ang .editorconfig o .vscode/settings.json ng isang repository
Here_oneLook=Hindi itinatakda rito: iisa ang hitsura ng NMOX Studio
Here_terminal=Hindi na-import: may sariling mga setting ang Terminal, at hindi ipinapakita ang mga halagang ito
Here_invalid=Hindi itinatakda rito: hindi ito isang halagang tinatanggap ng setting na ito
