CTL_SassCompile=Kompilasi ke CSS
SassCompileAction_compiled={0} dikompilasi.
SassCompileAction_compiledArmed={0} dikompilasi — akan dikompilasi ulang saat menyimpan.
SassCompileAction_couldNotSave=Tidak dapat menyimpan sebelum mengompilasi.
SassCompileAction_failed=Kesalahan Sass: {0}
SassCompileAction_noSass=sass tidak ditemukan — pasang di proyek (npm i -D sass) atau secara global di PATH.
SassCompileAction_notLocal=Bukan berkas lokal.
SassCompileAction_partial=Partial (_{0}) adalah impor, bukan titik masuk — kompilasi lembar gaya yang memakainya.
