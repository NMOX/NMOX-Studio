CTL_FormatWithPrettier=Prettier से फ़ॉर्मैट करें
FormatOnSave_detail=<html><i>केवल उन प्रोजेक्ट में चलता है जिन्होंने Prettier चुना है — .prettierrc / prettier.config फ़ाइल, या ऐसा package.json जिसमें prettier का उल्लेख हो। प्रोजेक्ट के अपने node_modules/.bin/prettier को ग्लोबल इंस्टॉल पर वरीयता मिलती है। जो फ़ाइलें फ़ॉर्मैट नहीं हो पातीं वे बिना बदलाव सहेजी जाती हैं।</i></html>
