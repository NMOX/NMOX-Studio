CTL_SassCompile=CSS में कंपाइल करें
SassCompileAction_compiled={0} कंपाइल किया।
SassCompileAction_compiledArmed={0} कंपाइल किया — सहेजने पर दोबारा कंपाइल होगा।
SassCompileAction_couldNotSave=कंपाइल करने से पहले सहेजा नहीं जा सका।
SassCompileAction_failed=Sass त्रुटि: {0}
SassCompileAction_noSass=sass नहीं मिला — इसे प्रोजेक्ट में (npm i -D sass) या ग्लोबली PATH पर इंस्टॉल करें।
SassCompileAction_notLocal=यह लोकल फ़ाइल नहीं है।
SassCompileAction_partial=पार्शियल (_{0}) इंपोर्ट होते हैं, एंट्री पॉइंट नहीं — उस स्टाइलशीट को कंपाइल करें जो इसका उपयोग करती है।
