CTL_FormatWithPrettier=Mit Prettier formatieren
FormatOnSave_detail=<html><i>Läuft nur in Projekten, die sich für Prettier entschieden haben — eine .prettierrc-/prettier.config-Datei oder eine package.json, die Prettier erwähnt. Das projekteigene node_modules/.bin/prettier hat Vorrang vor einer globalen Installation. Dateien, deren Formatierung fehlschlägt, werden unverändert gespeichert.</i></html>
