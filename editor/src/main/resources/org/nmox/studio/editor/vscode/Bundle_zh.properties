CTL_ImportVsCodeSettings=导入 VS Code 设置…
ImportVsCode_title=导入 VS Code 设置
ImportVsCode_heading=读取自 {0}：{1}
ImportVsCode_intro=勾选的设置会在你按下“应用”时写入 NMOX Studio，并立即生效。未勾选的行在这里做的事与它们在 VS Code 中做的相近，但不完全相同：每一行都说明了差别。键盘快捷键保存在 keybindings.json 中，不会被读取：各套配置在“键盘映射”设置中。
ImportVsCode_others={0,choice,0#文件中没有读取其他内容。|1#文件中另有 1 项设置在这里没有对应项；它没有显示出来。|1<文件中另有 {0,number,integer} 项设置在这里没有对应项；它们没有显示出来。}
ImportVsCode_source=设置文件：
ImportVsCode_sourceName=要读取哪个 VS Code 设置文件
ImportVsCode_colImport=导入
ImportVsCode_colSetting=VS Code 设置
ImportVsCode_colValue=值
ImportVsCode_colHere=在 NMOX Studio 中
ImportVsCode_tableName=要导入的 VS Code 设置
ImportVsCode_apply=应用
ImportVsCode_cancel=取消
ImportVsCode_notFound=没有找到 VS Code 设置文件。查找过的位置：{0}
ImportVsCode_tooLarge={0} 超出了设置文件可能的大小；未导入任何内容
ImportVsCode_unreadable={0} 无法按带注释的 JSON 读取；未导入任何内容
ImportVsCode_nothing={0} 中没有任何内容在 NMOX Studio 中有对应项
ImportVsCode_applied={0,choice,0#没有应用任何 VS Code 设置|1#已应用 1 项 VS Code 设置|1<已应用 {0,number,integer} 项 VS Code 设置}
ImportVsCode_failed={0}。未应用：{1}
Here_font=这里不设置：编辑器字体在“字体和颜色”设置中选择（本机已安装 {0}）
Here_fontNone=这里不设置：编辑器字体在“字体和颜色”设置中选择（本机没有安装其中任何一种字体）
Here_fonts=这里不设置：编辑器字体及其大小在“字体和颜色”设置中选择
Here_tab=制表符宽度和缩进为 {0,choice,1#1 列|1<{0,number,integer} 列}，适用于所有语言（项目的 .editorconfig 或 .vscode/settings.json 仍然优先）
Here_tabOnly=制表符宽度为 {0,choice,1#1 列|1<{0,number,integer} 列}，适用于所有语言（项目的 .editorconfig 或 .vscode/settings.json 仍然优先）
Here_indent=缩进为 {0,choice,1#1 列|1<{0,number,integer} 列}，适用于所有语言（项目的 .editorconfig 或 .vscode/settings.json 仍然优先）
Here_spaces=用空格缩进，适用于所有语言（项目的 .editorconfig 或 .vscode/settings.json 仍然优先）
Here_tabs=用制表符缩进，适用于所有语言（项目的 .editorconfig 或 .vscode/settings.json 仍然优先）
Here_detect=这里不设置：缩进取设置中的值，文件自身的内容不会覆盖它
Here_wrapOn=按单词自动换行，适用于所有你没有用“自动换行”开关单独设置过的语言
Here_wrapOff=不自动换行，适用于所有你没有用“自动换行”开关单独设置过的语言
Here_wrapColumn=这里不设置：在某一列处换行在这里没有对应项；这里的换行只有开和关
Here_ruler=右边距线位于第 {0} 列
Here_rulerFirst=右边距线位于第 {0} 列：这里只显示一条线，即所列 {1,choice,1#1 条标尺|1<{1,number,integer} 条标尺}中的第一条
Here_rulerOff=不显示右边距线
Here_whitespaceOff=隐藏空白字符
Here_whitespaceAll=显示空白字符（这里同时也会显示行尾）
Here_whitespaceSome=这里不设置：空白字符要么处处显示，要么处处不显示，不会只在某些地方显示
Here_formatOn=开启“保存时格式化”（使用项目的 Prettier 配置格式化）
Here_formatOff=关闭“保存时格式化”
Here_minimapOn=显示缩略图
Here_minimapOff=隐藏缩略图
Here_stickyOn=显示粘性滚动
Here_stickyOff=隐藏粘性滚动
Here_autoSaveOff=关闭自动保存，编辑器失去焦点时也不保存
Here_autoSaveFocus=编辑器失去焦点时保存；不按时间自动保存
Here_autoSaveWindow=编辑器失去焦点时保存（VS Code 会等到窗口失去焦点；这里切换到另一个面板时也会保存）
Here_autoSaveMinutes={0,choice,1#每分钟|1<每 {0,number,integer} 分钟}自动保存一次
Here_autoSaveDelay=开启自动保存，按它自己以整分钟计的间隔保存（VS Code 在更改后 {0,number,#} 毫秒保存；这里没有这么快的保存）
Here_delayAlone=这里不设置：只有当 files.autoSave 为 afterDelay 时，这个延迟才有意义
Here_trimOn=保存时删除行尾空白，适用于所有语言
Here_trimOff=保存时不处理行尾空白，适用于所有语言
Here_repositoryOnly=这里不设置：这一项没有个人设置；保存时会遵循仓库的 .editorconfig 或 .vscode/settings.json
Here_oneLook=这里不设置：NMOX Studio 只有一种外观
Here_terminal=不导入：终端保留它自己的设置，这些值不会显示
Here_invalid=这里不设置：这个值不是该设置可以接受的值
Value_count={0,choice,1#1 项设置|1<{0,number,integer} 项设置}，不显示值
