CTL_FormatWithPrettier=Formatuj przy użyciu Prettier
FormatOnSave_detail=<html><i>Działa tylko w projektach, które wybrały Prettier — plik .prettierrc / prettier.config albo package.json wspominający prettier. Własny node_modules/.bin/prettier projektu ma pierwszeństwo przed instalacją globalną. Pliki, których nie da się sformatować, zapisują się bez zmian.</i></html>
FormatOnSave_DisplayName=Formatowanie przy zapisie
