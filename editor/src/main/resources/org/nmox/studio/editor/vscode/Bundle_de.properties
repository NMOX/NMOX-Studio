Here_oneLook=Hier nicht gesetzt: NMOX Studio hat ein einziges Erscheinungsbild
Here_terminal=Nicht importiert: Das Terminal behält seine eigenen Einstellungen, und diese Werte werden nicht angezeigt
Here_invalid=Hier nicht gesetzt: Diesen Wert nimmt die Einstellung nicht an
