Here_tab=Tabulatorbreite und Einrückung {0,choice,1#1 Spalte|1<{0,number,integer} Spalten}, in jeder Sprache (eine .editorconfig oder .vscode/settings.json des Projekts hat weiterhin Vorrang)
Here_tabOnly=Tabulatorbreite {0,choice,1#1 Spalte|1<{0,number,integer} Spalten}, in jeder Sprache (eine .editorconfig oder .vscode/settings.json des Projekts hat weiterhin Vorrang)
Here_indent=Einrückung {0,choice,1#1 Spalte|1<{0,number,integer} Spalten}, in jeder Sprache (eine .editorconfig oder .vscode/settings.json des Projekts hat weiterhin Vorrang)
