Here_stickyOff=Sticky Scroll ausgeblendet
Here_autoSaveOff=Automatisch speichern aus, und kein Speichern, wenn ein Editor den Fokus verliert
Here_autoSaveFocus=Speichern, wenn ein Editor den Fokus verliert; kein zeitgesteuertes automatisches Speichern
Here_autoSaveWindow=Speichern, wenn ein Editor den Fokus verliert (VS Code wartete, bis das Fenster den Fokus verlor; hier wird auch gespeichert, wenn Sie in ein anderes Panel wechseln)
