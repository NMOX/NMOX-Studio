ImportVsCode_intro=Markierte Einstellungen werden in NMOX Studio geschrieben, wenn Sie Übernehmen drücken, und wirken sofort. Nicht markierte Zeilen tun etwas Ähnliches wie in VS Code, aber nicht genau dasselbe: Jede sagt, worin der Unterschied liegt. Tastenkürzel stehen in keybindings.json, und diese Datei wird nicht gelesen: Die Profile liegen in den Einstellungen unter Tastaturbelegung.
