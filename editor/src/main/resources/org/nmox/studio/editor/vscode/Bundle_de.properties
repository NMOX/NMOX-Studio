Here_wrapOff=Kein weicher Umbruch, in jeder Sprache, die Sie nicht mit dem Schalter Zeilenumbruch eigens eingestellt haben
Here_wrapColumn=Hier nicht gesetzt: Für den Umbruch an einer Spalte gibt es keine Entsprechung; der Umbruch ist hier ein oder aus
