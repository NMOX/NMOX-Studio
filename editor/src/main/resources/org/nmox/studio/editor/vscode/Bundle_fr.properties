Here_font=Pas réglé ici : la police de l’éditeur se choisit dans les réglages Polices et couleurs ({0} est installée sur cette machine)
Here_fontNone=Pas réglé ici : la police de l’éditeur se choisit dans les réglages Polices et couleurs (aucune de ces polices n’est installée sur cette machine)
Here_fonts=Pas réglé ici : la police de l’éditeur et sa taille se choisissent dans les réglages Polices et couleurs
Here_tab=Largeur de tabulation et indentation de {0,choice,1#1 colonne|1<{0,number,integer} colonnes}, pour tous les langages (un .editorconfig ou un .vscode/settings.json du projet l’emporte toujours)
Here_tabOnly=Largeur de tabulation de {0,choice,1#1 colonne|1<{0,number,integer} colonnes}, pour tous les langages (un .editorconfig ou un .vscode/settings.json du projet l’emporte toujours)
Here_indent=Indentation de {0,choice,1#1 colonne|1<{0,number,integer} colonnes}, pour tous les langages (un .editorconfig ou un .vscode/settings.json du projet l’emporte toujours)
Here_spaces=Indentation par des espaces, pour tous les langages (un .editorconfig ou un .vscode/settings.json du projet l’emporte toujours)
Here_tabs=Indentation par des tabulations, pour tous les langages (un .editorconfig ou un .vscode/settings.json du projet l’emporte toujours)
Here_detect=Pas réglé ici : l’indentation est celle que disent les réglages, et le contenu propre d’un fichier ne la remplace pas
Here_wrapOn=Retour à la ligne visuel entre les mots, dans tous les langages que vous n’avez pas mis à part avec la bascule Retour automatique à la ligne
Here_wrapOff=Pas de retour à la ligne visuel, dans tous les langages que vous n’avez pas mis à part avec la bascule Retour automatique à la ligne
Here_wrapColumn=Pas réglé ici : le retour à la ligne à une colonne donnée n’a pas d’équivalent ; ici, le retour à la ligne est activé ou désactivé
Here_ruler=Ligne de marge droite à la colonne {0}
Here_rulerFirst=Ligne de marge droite à la colonne {0} : une seule ligne est affichée ici, la première de {1,choice,1#1 règle|1<{1,number,integer} règles}
Here_rulerOff=Pas de ligne de marge droite
Here_whitespaceOff=Caractères d’espacement masqués
Here_whitespaceAll=Caractères d’espacement affichés (ici, cela affiche aussi les fins de ligne)
Here_whitespaceSome=Pas réglé ici : les espacements sont affichés partout ou nulle part, jamais à certains endroits seulement
Here_formatOn=Formater à l’enregistrement activé (la mise en forme utilise la configuration Prettier du projet)
Here_formatOff=Formater à l’enregistrement désactivé
Here_minimapOn=Minicarte affichée
Here_minimapOff=Minicarte masquée
Here_stickyOn=Défilement épinglé affiché
Here_stickyOff=Défilement épinglé masqué
Here_autoSaveOff=Enregistrement automatique désactivé, et pas d’enregistrement quand un éditeur perd le focus
Here_autoSaveFocus=Enregistrement quand un éditeur perd le focus ; pas d’enregistrement automatique périodique
Here_autoSaveWindow=Enregistrement quand un éditeur perd le focus (VS Code attendait que la fenêtre perde le focus ; ici, l’enregistrement a aussi lieu quand vous passez à un autre panneau)
Here_autoSaveMinutes=Enregistrement automatique {0,choice,1#chaque minute|1<toutes les {0,number,integer} minutes}
Here_autoSaveDelay=Enregistrement automatique activé, à son propre intervalle en minutes entières (VS Code enregistrait {0,number,#} ms après une modification ; rien ici n’enregistre aussi vite)
Here_delayAlone=Pas réglé ici : le délai ne compte que lorsque files.autoSave vaut afterDelay
Here_trimOn=Suppression des espaces en fin de ligne à l’enregistrement, pour tous les langages
Here_trimOff=Espaces en fin de ligne laissés tels quels à l’enregistrement, pour tous les langages
Here_repositoryOnly=Pas réglé ici : il n’existe pas de réglage personnel pour cela ; un .editorconfig ou un .vscode/settings.json du dépôt est respecté à l’enregistrement
Here_oneLook=Pas réglé ici : NMOX Studio n’a qu’une seule apparence
Here_terminal=Non importé : le Terminal garde ses propres réglages, et ces valeurs ne sont pas affichées
Here_invalid=Pas réglé ici : cette valeur n’est pas l’une de celles que prend ce réglage
