ImportVsCode_intro=Les réglages cochés sont écrits dans NMOX Studio quand vous appuyez sur Appliquer, et prennent effet aussitôt. Les lignes non cochées font quelque chose de proche, mais pas d’identique, de ce qu’elles faisaient dans VS Code : chacune dit en quoi. Les raccourcis clavier se trouvent dans keybindings.json, qui n’est pas lu : ce sont les réglages Raccourcis clavier qui contiennent les profils.
