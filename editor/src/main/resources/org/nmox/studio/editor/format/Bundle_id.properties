CTL_FormatWithPrettier=Format dengan Prettier
FormatOnSave_detail=<html><i>Hanya berjalan di proyek yang memilih memakai Prettier — berkas .prettierrc / prettier.config atau package.json yang menyebut prettier. node_modules/.bin/prettier milik proyek itu sendiri lebih diutamakan daripada pemasangan global. Berkas yang gagal diformat tersimpan tanpa perubahan.</i></html>
FormatOnSave_DisplayName=Format saat menyimpan
FormatOnSave_enabled=Format berkas dengan Prettier saat menyimpan
FormatOnSave_Keywords=format simpan prettier pemformat
FormatWithPrettierAction_alreadyFormatted=Sudah terformat.
FormatWithPrettierAction_changed=Dokumen berubah saat pemformatan — jalankan lagi.
FormatWithPrettierAction_couldNotApply=Tidak dapat menerapkan teks yang diformat.
FormatWithPrettierAction_failed=Prettier tidak dapat memformat berkas ini (kesalahan sintaksis?).
FormatWithPrettierAction_formatted=Diformat dengan Prettier.
FormatWithPrettierAction_formattedDefaults=Diformat dengan setelan bawaan Prettier — proyek ini tidak punya konfigurasi Prettier.
FormatWithPrettierAction_noBuffer=Tidak ada bufer editor untuk diformat.
FormatWithPrettierAction_noPrettier=Prettier tidak ditemukan — pasang di proyek atau secara global di PATH.
FormatWithPrettierAction_tooLarge=Berkas terlalu besar untuk Prettier — batas ukuran saat menyimpan berlaku di sini juga.
FormatWithPrettierAction_untrusted=Tidak ada yang diformat: Prettier milik proyek ini tidak dijalankan, karena ruang kerjanya tidak dipercaya.
PrettierReformat_notConfigured=Tidak ada yang diformat: proyek ini tidak mengonfigurasi Prettier, dan NMOX Studio tidak punya pemformat lain untuk bahasa ini. {0}, di menu klik kanan editor, memformat berkas dengan setelan bawaan Prettier.
