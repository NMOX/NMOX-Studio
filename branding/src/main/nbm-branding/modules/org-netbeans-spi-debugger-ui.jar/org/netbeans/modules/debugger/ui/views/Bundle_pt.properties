# Ledger 136: the debugger's windows carry the name their menu row carries.
# Window > Debugging has read each language's own words since v2.143.0
# (CTL_SessionsAction and its six siblings, one package over in
# ui/actions), and the tab each row opens kept the platform's English:
# View.getName() reads these keys, read from the class's bytecode. One
# window, two names. Each value IS that language's own menu-row
# word with its mnemonic removed; nothing here is a second translation.
# Gated by MainWindowChromeSpeaksTest (the key still exists, saying this
# English) and WayfindingVocabularyTest (tab and row agree in every
# language).
