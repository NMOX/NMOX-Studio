# v2.145.0: the rows a RIGHT-CLICK paints.
# A context menu cannot be read by the accessibility API, so these had
# never been seen. PopupCensus asks the platform to build the popup and
# reads it; its first run found these English in a Hindi build. The fold
# family and Go to Declaration each paint a different key here than in
# the menu bar, so both spellings are written.
# Gated by PopupRowsSpeakTest.
LBL_DiffToRevisionAction_PopupName=So s\u00e1nh v\u1edbi\u2026

# 3.2.0: the Team menu, whose rows are named in CODE: the git module's
# Annotator and its DynamicMenus, VersioningMainMenu, local history's
# actions. No layer names them, so the walk of a German build found
# them English and bytecode placed each key. Gated by
# CodeNamedMenuRowsTest and MenuRowsSpeakTest.
LBL_DiffAction_Name=&Diff v\u1edbi HEAD
LBL_DiffCurrentToTrackedAction_Name=Diff v\u1edbi nh\u00e1nh \u0111ang the&o d\u00f5i
LBL_DiffCurrentToRepositoryAction_Name=Diff v\u1edbi HEAD c\u1ee7a kho l\u01b0u t&r\u1eef
LBL_DiffToRevisionAction_Name=Diff &v\u1edbi\u2026
LBL_ExportUncommittedChangesAction_Name=X&u\u1ea5t thay \u0111\u1ed5i ch\u01b0a commit\u2026
LBL_ExportCommitAction_Name=Xu\u1ea5t &commit\u2026
