# Annotator and its DynamicMenus, VersioningMainMenu, local history's
# actions. No layer names them, so the walk of a German build found
# them English and bytecode placed each key. Gated by
# CodeNamedMenuRowsTest and MenuRowsSpeakTest.
LBL_CommitAction_Name=\u05d1\u05d9\u05e6\u05d5\u05e2 commit(&M)\u2026
LBL_ExcludeFromCommitAction_Name=\u05d4\u05d7\u05e8\u05d2\u05d4 \u05de\u05d4\u2011commit(&C)
LBL_IncludeInCommitAction_Name=\u05d4\u05db\u05dc\u05dc\u05d4 \u05d1\u2011commit(&N)
