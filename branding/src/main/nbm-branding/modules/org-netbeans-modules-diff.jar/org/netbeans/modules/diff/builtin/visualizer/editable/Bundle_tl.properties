# 3.2.0: the platform's diff view, which `nmox -d left right` and
# `git difftool` open (ui DiffWindow embeds DiffController.createEnhanced).
# Only the keys EditableDiffView and its panes PAINT in that read-only view,
# found by reading the bytecode: the two view tabs, the divider's tooltip,
# the two placeholder panels, and the accessible names a screen reader says.
# The same view is the Team menu's diff, where the working copy is editable,
# so the action bar's Insert/Remove/Replace/Replace All tooltips and the
# large-file question's title paint there, and are overlaid too.
# Gated by DiffViewOverlayLedgerTest (diff-view-rows.txt).
