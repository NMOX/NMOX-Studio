copy-selection-else-line-down-main_menu_item=تكرار لأسفل(&B)
copy-selection-else-line-up-main_menu_item=تكرار لأعلى(&A)
jump_back_main_menu_item-main-menu=آخر مكان تعديل(&E)
move-selection-else-line-down-main_menu_item=تحريك لأسفل(&W)
move-selection-else-line-up-main_menu_item=تحريك لأعلى(&V)

