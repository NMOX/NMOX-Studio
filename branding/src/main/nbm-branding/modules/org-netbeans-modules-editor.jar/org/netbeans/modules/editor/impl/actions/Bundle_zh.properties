# v2.144.0: the menu rows whose names live in action CODE, not in the
# layer, so only a walk finds them and only a grep by VALUE places them.
# Where a module holds two names for one action, both are here: the menu
# reads one and the Keyboard Shortcuts sheet the other. The mnemonic
# mirrors English, whose own assignment does not collide.
# Gated by MenuRowsSpeakTest and CodeNamedMenuRowsTest.
# v2.143.0: the platform menu rows a reader sees, in their own language.
# An overlay of the platform bundle in the branding+locale slot (the
# v2.127.0 mechanism, the documented l10n path). The population is DERIVED
# from the assembled cluster\u2019s layers; mnemonics are assigned per menu so
# they cannot collide. Gated by MenuRowsSpeakTest.
clipboard-history=\u4ece\u5386\u53f2\u7c98\u8d34(&H)
copy-selection-else-line-down-main_menu_item=\u5411\u4e0b\u590d\u5236(&B)
copy-selection-else-line-up-main_menu_item=\u5411\u4e0a\u590d\u5236(&A)
jump_back_main_menu_item-main-menu=\u4e0a\u6b21\u7f16\u8f91\u4f4d\u7f6e(&E)
move-selection-else-line-down-main_menu_item=\u4e0b\u79fb(&W)
move-selection-else-line-up-main_menu_item=\u4e0a\u79fb(&V)

# 3.2: the editor toolbar, in the reader\u2019s language. Every button above an
# editor painted its tooltip in English. The key each button paints was
# read from the running toolbar (the action\u2019s SHORT_DESCRIPTION) and the
# bytecode that sets it; the population is DERIVED from every
# Editors/**/Toolbars/Default registration in the cluster\u2019s layers.
# Gated by MainWindowChromeSpeaksTest (the editor toolbar ledger).
NavigationHistoryBackAction_Tooltip_simple=\u540e\u9000
NavigationHistoryForwardAction_Tooltip_simple=\u524d\u8fdb
