# v2.144.0: the menu rows whose names live in action CODE, not in the
# layer, so only a walk finds them and only a grep by VALUE places them.
# Where a module holds two names for one action, both are here: the menu
# reads one and the Keyboard Shortcuts sheet the other. The mnemonic
# mirrors English, whose own assignment does not collide.
# Gated by MenuRowsSpeakTest and CodeNamedMenuRowsTest.
CTL_EditorsAction=\u05e2\u05d5\u05e8\u05db\u05d9\u05dd(&E)
CTL_SplitAction=\u05e4\u05d9\u05e6\u05d5\u05dc(&A)
# 3.2: the main window's own chrome, in the reader's language. A German
# walk found the editor's tabs reading Source / History, the Favorites tab
# and the Quick Search hint in English beside a translated menu bar. Found
# by a grep of the assembled cluster by VALUE; the tab names and the Quick
# Search categories are DERIVED from the cluster's layers. Gated by
