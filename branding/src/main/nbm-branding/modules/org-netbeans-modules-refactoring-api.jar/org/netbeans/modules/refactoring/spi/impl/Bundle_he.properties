# v2.145.0: the rows a RIGHT-CLICK paints.
# A context menu cannot be read by the accessibility API, so these had
# never been seen. PopupCensus asks the platform to build the popup and
# reads it; its first run found these English in a Hindi build. The fold
# family and Go to Declaration each paint a different key here than in
# the menu bar, so both spellings are written.
# Gated by PopupRowsSpeakTest.
# v2.143.0: the platform menu rows a reader sees, in their own language.
# An overlay of the platform bundle in the branding+locale slot (the
# v2.127.0 mechanism, the documented l10n path). The population is DERIVED
# from the assembled cluster\u2019s layers; mnemonics are assigned per menu so
# they cannot collide. Gated by MenuRowsSpeakTest.
