Menu/GoTo=&Pumunta
Menu/Help=T&ulong
Menu/Tools=&Kasangkapan
Menu/View=T&ingnan
Menu/Window/Tools=Mga tool ng IDE(&Z)
Menu/Window/Web=Web(&Y)
Toolbars=Mga toolbar
