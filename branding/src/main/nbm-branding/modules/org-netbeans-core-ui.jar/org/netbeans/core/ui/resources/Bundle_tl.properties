# v2.144.0: the menu rows whose names live in action CODE, not in the
# layer, so only a walk finds them and only a grep by VALUE places them.
# Where a module holds two names for one action, both are here: the menu
# reads one and the Keyboard Shortcuts sheet the other. The mnemonic
# mirrors English, whose own assignment does not collide.
# Gated by MenuRowsSpeakTest and CodeNamedMenuRowsTest.
