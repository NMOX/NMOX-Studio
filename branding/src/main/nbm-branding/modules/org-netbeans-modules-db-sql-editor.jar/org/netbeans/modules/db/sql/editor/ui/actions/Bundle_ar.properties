# v2.145.0: the rows a RIGHT-CLICK paints.
# A context menu cannot be read by the accessibility API, so these had
# never been seen. PopupCensus asks the platform to build the popup and
# reads it; its first run found these English in a Hindi build. The fold
# family and Go to Declaration each paint a different key here than in
# the menu bar, so both spellings are written.
# Gated by PopupRowsSpeakTest.
LBL_RunCurrentStatementAction=تشغيل الجملة(&R)
LBL_SQLHistoryAction=سجل SQL
LBL_SelectInExplorerAction=اختيار الاتصال في Services

# 3.2: the editor toolbar, in the reader\u2019s language. Every button above an
# editor painted its tooltip in English. The key each button paints was
# read from the running toolbar (the action\u2019s SHORT_DESCRIPTION) and the
# bytecode that sets it; the population is DERIVED from every
# Editors/**/Toolbars/Default registration in the cluster\u2019s layers.
# Gated by MainWindowChromeSpeaksTest (the editor toolbar ledger).
