# v2.144.0: the menu rows whose names live in action CODE, not in the
# layer, so only a walk finds them and only a grep by VALUE places them.
# Where a module holds two names for one action, both are here: the menu
# reads one and the Keyboard Shortcuts sheet the other. The mnemonic
# mirrors English, whose own assignment does not collide.
# Gated by MenuRowsSpeakTest and CodeNamedMenuRowsTest.
find-selection=\u041d\u0430\u0439\u0442\u0438 \u0432\u044b\u0434\u0435\u043b\u0435\u043d\u043d\u043e\u0435

# 3.2: the editor toolbar, in the reader\u2019s language. Every button above an
# editor painted its tooltip in English. The key each button paints was
# read from the running toolbar (the action\u2019s SHORT_DESCRIPTION) and the
# bytecode that sets it; the population is DERIVED from every
# Editors/**/Toolbars/Default registration in the cluster\u2019s layers.
# Gated by MainWindowChromeSpeaksTest (the editor toolbar ledger).
