# v2.145.0: the rows a RIGHT-CLICK paints.
# A context menu cannot be read by the accessibility API, so these had
# never been seen. PopupCensus asks the platform to build the popup and
# reads it; its first run found these English in a Hindi build. The fold
# family and Go to Declaration each paint a different key here than in
# the menu bar, so both spellings are written.
# Gated by PopupRowsSpeakTest.
# v2.144.0: the menu rows whose names live in action CODE, not in the
# layer, so only a walk finds them and only a grep by VALUE places them.
# Where a module holds two names for one action, both are here: the menu
# reads one and the Keyboard Shortcuts sheet the other. The mnemonic
# mirrors English, whose own assignment does not collide.
# Gated by MenuRowsSpeakTest and CodeNamedMenuRowsTest.
# v2.143.0: the platform menu rows a reader sees, in their own language.
# An overlay of the platform bundle in the branding+locale slot (the
# v2.127.0 mechanism, the documented l10n path). The population is DERIVED
# from the assembled cluster\u2019s layers; mnemonics are assigned per menu so
# they cannot collide. Gated by MenuRowsSpeakTest.
CTL_Tools=\u0909\u092a\u0915\u0930\u0923
Copy=\u0915\u0949\u092a\u0940 \u0915\u0930\u0947\u0902(&Y)
Cut=\u0915\u091f \u0915\u0930\u0947\u0902(&T)
Delete=\u0939\u091f\u093e\u090f\u0901(&D)
Find=\u0916\u094b\u091c\u0947\u0902(&F)\u2026
Goto=\u0932\u093e\u0907\u0928 \u092a\u0930 \u091c\u093e\u090f\u0901(&L)\u2026
Paste=\u092a\u0947\u0938\u094d\u091f \u0915\u0930\u0947\u0902(&A)
RedoSimple=\u092b\u093f\u0930 \u0938\u0947 \u0915\u0930\u0947\u0902(&R)
Replace=\u092c\u0926\u0932\u0947\u0902(&E)\u2026
Save=\u0938\u0939\u0947\u091c\u0947\u0902(&S)
UndoSimple=\u092a\u0942\u0930\u094d\u0935\u0935\u0924 \u0915\u0930\u0947\u0902(&U)
View=\u0926\u0947\u0916\u0947\u0902

# 3.1.0: the rows Project Studio's file tree paints on a right-click.
# Measured by building the tree's real nodes and reading every row it
# offers: these read English in every translated build, beside the
# Copy Path and Reveal rows 3.1.0 added in the reader's own language.
# Gated by FileTreeRowsSpeakTest and PopupRowsSpeakTest.
Rename=\u0928\u093e\u092e \u092c\u0926\u0932\u0947\u0902\u2026
Open=\u0916\u094b\u0932\u0947\u0902
Properties=\u092a\u094d\u0930\u0949\u092a\u0930\u094d\u091f\u0940(&P)
# 3.2.0: the main toolbar's tooltips. A toolbar button paints its
# action's SHORT_DESCRIPTION (else its NAME), not the menu row's key, so
# these are the keys the buttons PAINT, read from each action's bytecode.
# Gated by ToolbarOverlayGateTest (population derived from Toolbars/**).
CTL_GC=\u0917\u093e\u0930\u094d\u092c\u0947\u091c \u0915\u0932\u0947\u0915\u094d\u0936\u0928 \u091c\u093c\u092c\u0930\u0926\u0938\u094d\u0924\u0940 \u091a\u0932\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094d\u0932\u093f\u0915 \u0915\u0930\u0947\u0902
LBL_ShowText=\u091f\u0947\u0915\u094d\u0938\u094d\u091f \u0926\u093f\u0916\u093e\u090f\u0901
UndoWithParameter={0} \u092a\u0942\u0930\u094d\u0935\u0935\u0924 \u0915\u0930\u0947\u0902(&U)
RedoWithParameter={0} \u092b\u093f\u0930 \u0938\u0947 \u0915\u0930\u0947\u0902(&R)
