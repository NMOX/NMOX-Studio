#
# NMOX Studio (after 3.2.0, ledger 122): the platform's Mnemonics gives a
# menu row a key only for A-Z and 0-9 and asks this table for any other
# letter; the platform ships none for Ukrainian, so every Ukrainian mnemonic
# underlined a letter no key reached. Each Cyrillic letter maps to the key
# it sits on in the standard Ukrainian (Enhanced) JCUKEN layout: the Latin letter printed on
# that key, or the java.awt.event.KeyEvent code of a punctuation key. That
# is the key a Latin layout presses in the same place, and the key code
# Windows and X11 report for the letter under a Ukrainian layout. Both cases:
# the lookup is by the character as written.
#
# Built into modules/locale/org-openide-awt_uk.jar by branding/pom.xml
# (an nbm:branding execution whose token is the locale), and held against
# every Ukrainian mnemonic in the cluster by TranslatedMnemonicsTest.

