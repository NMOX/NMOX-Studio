# NMOX Studio (after 3.2.0, ledger 122): the platform's Mnemonics gives a
# menu row or button a key only for A-Z and 0-9 and asks this table for any
# other letter; the platform ships none for French, so a French mnemonic on
# an accented letter underlined a letter no key reached. Every precomposed
# Latin letter maps to the key of its base letter: the letter it decomposes
# to in Unicode (E WITH ACUTE -> E, N WITH ACUTE -> N, U WITH HORN -> U),
# or for the few with no decomposition the letter it is written from
# (D WITH STROKE -> D, L WITH STROKE -> L, SHARP S -> S, O WITH STROKE -> O).
# One table for every language written in Latin letters, generated from
# that rule; the same file in each of them.
#
# Built into modules/locale/org-openide-awt_fr.jar by branding/pom.xml
# (an nbm:branding execution whose token is the locale), and held against
# every French mnemonic in the cluster by TranslatedMnemonicsTest.

