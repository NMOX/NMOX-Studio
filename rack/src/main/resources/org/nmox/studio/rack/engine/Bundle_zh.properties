GitCheckoutGuard_midMerge=有一个合并正在进行 — 请先完成或中止它（git merge --continue 或 git merge --abort）
GitCheckoutGuard_midRebase=有一个变基正在进行 — 请先完成或中止它（git rebase --continue 或 git rebase --abort）
GitCheckoutGuard_midCherryPick=有一个拣选正在进行 — 请先完成或中止它（git cherry-pick --continue 或 git cherry-pick --abort）
GitCheckoutGuard_midRevert=有一个还原正在进行 — 请先完成或中止它（git revert --continue 或 git revert --abort）
GitCheckoutGuard_midAm=git am 正在应用补丁 — 请先完成或中止它（git am --continue 或 git am --abort）
GitCheckoutGuard_midBisect=二分查找正在进行 — 请先结束它（git bisect reset）
