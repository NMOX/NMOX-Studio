GitCheckoutGuard_midMerge=trwa merge — najpierw go dokończ lub przerwij (git merge --continue albo git merge --abort)
GitCheckoutGuard_midRebase=trwa rebase — najpierw go dokończ lub przerwij (git rebase --continue albo git rebase --abort)
GitCheckoutGuard_midCherryPick=trwa cherry-pick — najpierw go dokończ lub przerwij (git cherry-pick --continue albo git cherry-pick --abort)
GitCheckoutGuard_midRevert=trwa revert — najpierw go dokończ lub przerwij (git revert --continue albo git revert --abort)
GitCheckoutGuard_midAm=git am nakłada łatki — najpierw go dokończ lub przerwij (git am --continue albo git am --abort)
GitCheckoutGuard_midBisect=trwa bisect — najpierw go zakończ (git bisect reset)
