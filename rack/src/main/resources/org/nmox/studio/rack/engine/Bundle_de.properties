GitCheckoutGuard_midMerge=ein Merge läuft — schließen Sie ihn erst ab oder brechen Sie ihn ab (git merge --continue oder git merge --abort)
GitCheckoutGuard_midRebase=ein Rebase läuft — schließen Sie ihn erst ab oder brechen Sie ihn ab (git rebase --continue oder git rebase --abort)
GitCheckoutGuard_midCherryPick=ein Cherry-Pick läuft — schließen Sie ihn erst ab oder brechen Sie ihn ab (git cherry-pick --continue oder git cherry-pick --abort)
GitCheckoutGuard_midRevert=ein Revert läuft — schließen Sie ihn erst ab oder brechen Sie ihn ab (git revert --continue oder git revert --abort)
GitCheckoutGuard_midAm=git am wendet Patches an — schließen Sie es erst ab oder brechen Sie es ab (git am --continue oder git am --abort)
GitCheckoutGuard_midBisect=ein Bisect läuft — beenden Sie ihn erst (git bisect reset)
