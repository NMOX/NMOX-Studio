KvasirConsent_codeMessage=<html><b>Wysłać ten zaznaczony kod do {0}?</b><br><br>Ask KVASIR wyśle <b>tylko</b> poniższe dane i nic więcej:<ul><li>zaznaczony przez Ciebie kod ({1} znaków)</li><li>nazwę pliku: <code>{2}</code></li><li>jego język: <code>{3}</code></li><li>Twoje pytanie</li></ul><b>Nie</b> wysyła reszty pliku, innych plików, zmiennych środowiskowych ani żadnych sekretów.<br><br>Twój klucz API uwierzytelnia żądanie. Ten wybór zostanie zapamiętany.</html>
KvasirConsent_codeTitle=Ask KVASIR — wysłać zaznaczony kod?
KvasirConsent_failureMessage=<html><b>Wysłać to niepowodzenie do {0} po wyjaśnienie?</b><br><br>KVASIR wyśle <b>tylko</b> poniższe dane i nic więcej:<ul><li>polecenie, które zawiodło: <code>{1}</code></li><li>jego kod wyjścia: <code>{2}</code></li><li>do pięciu przykładowych wierszy błędu</li><li>urządzenie (tor zadania): <code>{3}</code></li><li>nazwę projektu: <code>{4}</code></li></ul><b>Nie</b> wysyła Twoich plików źródłowych, zmiennych środowiskowych ani żadnych sekretów.<br><br>Twój klucz API służy do uwierzytelnienia żądania. Ten wybór zostanie zapamiętany.</html>
KvasirConsent_failureTitle=KVASIR — wysłać niepowodzenie po wyjaśnienie?
KvasirConsent_keepLocal=Zachowaj lokalnie
KvasirConsent_kindMessage=<html><b>Wysłać to do {0} po wyjaśnienie?</b><br><br>KVASIR wyśle <b>tylko</b> poniższe dane i nic więcej:<ul><li>{1}</li></ul>Poza powyższym wierszem nie wysyła <b>niczego</b> — żadnych zmiennych środowiskowych, żadnych sekretów, niczego, czego nie wymienił.<br><br>Twój klucz API służy do uwierzytelnienia żądania. Ten wybór jest zapamiętywany tylko dla tego rodzaju żądań.</html>
