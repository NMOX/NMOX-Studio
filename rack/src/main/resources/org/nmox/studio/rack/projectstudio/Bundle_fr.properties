RackPresets_shipLaneName=Voie de livraison
RackPresets_tddLoopDescription=REFLEX armé : chaque enregistrement lance les tests, décompte sur la console
RackPresets_tddLoopName=Boucle TDD
RackPresets_uptimeWatchDescription=Pendant que le serveur de dev tourne, TEMPO cadence les contrôles de santé PING
RackPresets_uptimeWatchName=Veille de disponibilité
RackPresets_web3BenchDescription=Chaîne ANVIL + forge build/test + porte de gaz GOVERNOR, MONITOR en surveillance
RackPresets_web3BenchName=Banc Web3
