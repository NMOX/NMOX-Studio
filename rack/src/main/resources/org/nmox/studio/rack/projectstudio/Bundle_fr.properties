RackPresets_lampBenchName=Banc LAMP
RackPresets_modernWebDescription=VELOCITY sert (SCOPE ouvre le navigateur sur READY) ; les enregistrements se ramifient vers les tests VERITAS et le lint PURITY
RackPresets_modernWebName=Web moderne
RackPresets_monorepoLanesDescription=Dépôt mixte : ROSETTA montre le mélange, WAYPOINT choisit le paquet, les enregistrements se ramifient vers les voies node + cargo test
RackPresets_monorepoLanesName=Voies monorepo
