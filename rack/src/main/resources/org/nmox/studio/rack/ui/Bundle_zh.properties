# The device shelf's catalogue entries (v2.132.0). A faceplate stays
# English by decision — the hardware panel — but a shelf card is how a
# person CHOOSES a device, so it speaks their language. English lives
# only in DeviceType (it generates docs/devices.md); a missing key here
# falls back to it, which is how a JSON drop-in keeps its own words.
# Tool names are never translated: typing vite must find the Vite console.
