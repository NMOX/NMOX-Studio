KvasirConsent_codeMessage=<html><b>Diese Codeauswahl an {0} senden?</b><br><br>KVASIR fragen sendet <b>ausschließlich</b> Folgendes und nichts anderes:<ul><li>den Code, den Sie ausgewählt haben ({1} Zeichen)</li><li>den Namen der Datei: <code>{2}</code></li><li>ihre Sprache: <code>{3}</code></li><li>Ihre Frage</li></ul>Es sendet <b>nicht</b> den Rest der Datei, andere Dateien, Umgebungsvariablen oder irgendein Geheimnis.<br><br>Ihr API-Schlüssel authentifiziert die Anfrage. Diese Entscheidung wird gemerkt.</html>
KvasirConsent_codeTitle=KVASIR fragen — ausgewählten Code senden?
KvasirConsent_failureMessage=<html><b>Diesen Fehler zur Erklärung an {0} senden?</b><br><br>KVASIR sendet <b>ausschließlich</b> Folgendes und nichts anderes:<ul><li>den fehlgeschlagenen Befehl: <code>{1}</code></li><li>dessen Exit-Code: <code>{2}</code></li><li>bis zu fünf ausgewählte Fehlerzeilen</li><li>das Gerät (Aufgabenspur): <code>{3}</code></li><li>den Projektnamen: <code>{4}</code></li></ul>Es sendet <b>nicht</b> Ihre Quelldateien, Umgebungsvariablen oder irgendein Geheimnis.<br><br>Ihr API-Schlüssel wird zur Authentifizierung der Anfrage verwendet. Diese Entscheidung wird gemerkt.</html>
KvasirConsent_failureTitle=KVASIR — Fehler zur Erklärung senden?
KvasirConsent_keepLocal=Lokal behalten
KvasirConsent_kindMessage=<html><b>Dies zur Erklärung an {0} senden?</b><br><br>KVASIR sendet <b>ausschließlich</b> Folgendes und nichts anderes:<ul><li>{1}</li></ul>Es sendet <b>nichts</b> über die obige Zeile hinaus — keine Umgebungsvariablen, keine Geheimnisse, nichts, was es nicht genannt hat.<br><br>Ihr API-Schlüssel wird zur Authentifizierung der Anfrage verwendet. Diese Entscheidung wird nur für diese Art von Anfrage gemerkt.</html>
