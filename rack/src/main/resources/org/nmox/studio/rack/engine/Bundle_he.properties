GitCheckoutGuard_midMerge=‏מיזוג בתהליך — סיימו או בטלו אותו קודם (git merge --continue, או git merge --abort)
GitCheckoutGuard_midRebase=‏rebase בתהליך — סיימו או בטלו אותו קודם (git rebase --continue, או git rebase --abort)
GitCheckoutGuard_midCherryPick=‏cherry-pick בתהליך — סיימו או בטלו אותו קודם (git cherry-pick --continue, או git cherry-pick --abort)
GitCheckoutGuard_midRevert=‏revert בתהליך — סיימו או בטלו אותו קודם (git revert --continue, או git revert --abort)
