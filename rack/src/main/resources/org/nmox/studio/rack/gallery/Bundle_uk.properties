# The starter racks the Rack Gallery lists (v2.179.0). English is generated from @Messages in RackGallery.
# Faceplate names (REFLEX, VERITAS, …), READY, package.json, forge test and install → build → test stay as written.
RackGallery_starterPolyglotName=Запуск · Налагодження · Тести
RackGallery_starterPolyglotDescription=Запуск, налагодження й тести для будь-якого набору інструментів у циклі збереження: REFLEX перезапускає VERITAS, поруч IGNITION та INSPECTOR на одному MONITOR.
RackGallery_starterNodeName=Пакет Node
RackGallery_starterNodeDescription=CRATE встановлює, NPM-9000 запускає скрипт, який ви обираєте з package.json, а REFLEX перезапускає тести під час кожного збереження.
RackGallery_starterViteName=Сайт на Vite
RackGallery_starterViteDescription=SURGE віддає сайт для SCOPE, MAESTRO запускає install → build → test, а REFLEX тестує заново під час кожного збереження.
RackGallery_starterAngularName=Застосунок Angular
RackGallery_starterAngularDescription=HALO віддає й відкриває SCOPE, щойно все готово, CRATE встановлює, а REFLEX перезапускає VERITAS під час кожного збереження.
RackGallery_starterExpressName=HTTP-сервіс на Node
RackGallery_starterExpressDescription=SURGE запускає сервіс, і щойно він READY, PING викликає його маршрут перевірки стану; кожна смуга виходить на MONITOR.
RackGallery_starterStaticName=Статичний сайт
RackGallery_starterStaticDescription=SURGE віддає теку, а SCOPE відкриває її, щойно вона готова — збирати нічого.
RackGallery_starterBeamName=Проєкт BEAM
RackGallery_starterBeamDescription=CRATE завантажує залежності, потім VERITAS запускає набір тестів; REFLEX тестує заново під час кожного збереження, а IGNITION запускає застосунок.
RackGallery_starterFoundryName=Контракти Foundry
RackGallery_starterFoundryDescription=ANVIL — локальний ланцюг, а REFLEX запускає forge test через VERITAS під час кожного збереження.
