GitCheckoutGuard_midMerge=may merge na kasalukuyang tumatakbo — tapusin o i-abort muna (git merge --continue, o git merge --abort)
GitCheckoutGuard_midRebase=may rebase na kasalukuyang tumatakbo — tapusin o i-abort muna (git rebase --continue, o git rebase --abort)
GitCheckoutGuard_midCherryPick=may cherry-pick na kasalukuyang tumatakbo — tapusin o i-abort muna (git cherry-pick --continue, o git cherry-pick --abort)
GitCheckoutGuard_midRevert=may revert na kasalukuyang tumatakbo — tapusin o i-abort muna (git revert --continue, o git revert --abort)
GitCheckoutGuard_midAm=naglalapat ng mga patch ang git am — tapusin o i-abort muna (git am --continue, o git am --abort)
GitCheckoutGuard_midBisect=may bisect na kasalukuyang tumatakbo — tapusin muna (git bisect reset)
