KvasirConsent_failureMessage=<html><b>Отправить этот сбой в {0} для объяснения?</b><br><br>KVASIR отправит <b>только</b> следующее и ничего больше:<ul><li>команду, завершившуюся сбоем: <code>{1}</code></li><li>её код возврата: <code>{2}</code></li><li>до пяти выбранных строк с ошибками</li><li>устройство (линию задач): <code>{3}</code></li><li>имя проекта: <code>{4}</code></li></ul>Он <b>не</b> отправляет ваши исходные файлы, переменные среды или какие-либо секреты.<br><br>Ваш ключ API используется для аутентификации запроса. Этот выбор запоминается.</html>
