KvasirConsent_codeMessage=<html><b>Отправить этот выделенный код в {0}?</b><br><br>Ask KVASIR отправит <b>только</b> следующее и ничего больше:<ul><li>выделенный вами код ({1} символов)</li><li>имя файла: <code>{2}</code></li><li>его язык: <code>{3}</code></li><li>ваш вопрос</li></ul>Он <b>не</b> отправляет остальную часть файла, другие файлы, переменные среды или какие-либо секреты.<br><br>Ваш ключ API используется для аутентификации запроса. Этот выбор запоминается.</html>
