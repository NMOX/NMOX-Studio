RackPresets_ciLaneDescription=MAESTRO dispara install → build → test, con la salida en la consola
RackPresets_ciLaneName=Vía de CI
RackPresets_classicWebDescription=CRATE instala (npm + bower), DYNAMO ejecuta el taskfile, IGNITION sirve el sitio, VITALS lo puntúa
RackPresets_classicWebName=Banco de web clásica
RackPresets_devIntelligenceDescription=Sirve con plena consciencia: sondas de salud cronometradas, radar de puertos, registrador de vuelo, seguimiento del log
RackPresets_devIntelligenceName=Inteligencia de desarrollo
RackPresets_devLoopDescription=El servidor de desarrollo abre el navegador solo; los guardados ejecutan las pruebas
RackPresets_devLoopName=Bucle de desarrollo
RackPresets_e2eLoopDescription=VELOCITY sirve y SPECTER ejecuta la suite E2E en cuanto se dispara READY; REPORT reapunta SCOPE al informe HTML
RackPresets_e2eLoopName=Bucle E2E
RackPresets_lampBenchDescription=composer install se reparte entre phpunit + phpstan + Pint; IGNITION sirve public/
RackPresets_lampBenchName=Banco LAMP
RackPresets_modernWebDescription=VELOCITY sirve (SCOPE abre el navegador al llegar READY); los guardados se reparten entre las pruebas de VERITAS y el lint de PURITY
RackPresets_modernWebName=Web moderna
RackPresets_monorepoLanesDescription=Repositorio mixto: ROSETTA muestra la mezcla, WAYPOINT marca el paquete, los guardados se reparten entre las vías de node y de cargo test
RackPresets_monorepoLanesName=Vías de monorepo
RackPresets_multiChainBenchDescription=STELLAR + ANCHOR + ANVIL uno al lado del otro — vías Soroban, Solana y EVM en un solo MONITOR
RackPresets_multiChainBenchName=Banco multicadena
RackPresets_polyglotGauntletDescription=Los guardados de cada lenguaje activan su propia vía; QUORUM libera PREFLIGHT solo cuando todas las vías están en verde
RackPresets_polyglotGauntletName=Desafío políglota
RackPresets_shipGateDescription=Compilación de producción → mínimo de Lighthouse → presupuesto de bundle → veredicto de PREFLIGHT → despliegue armado
RackPresets_shipGateName=Puerta de publicación
RackPresets_shipLaneDescription=Compilación de producción → análisis de seguridad → despliegue armado, con rastro en la consola
RackPresets_shipLaneName=Vía de publicación
RackPresets_tddLoopDescription=REFLEX armado: cada guardado ejecuta las pruebas, con el recuento en la consola
RackPresets_tddLoopName=Bucle TDD
RackPresets_uptimeWatchDescription=Mientras el servidor de desarrollo funciona, TEMPO cronometra las comprobaciones de salud de PING
RackPresets_uptimeWatchName=Vigilancia de disponibilidad
RackPresets_web3BenchDescription=Cadena ANVIL + forge build/test + control de gas de GOVERNOR, con MONITOR vigilando
RackPresets_web3BenchName=Banco Web3
RackPresets_webPipelineDescription=MAESTRO dispara install → build → test; SURGE abre el navegador al servir
RackPresets_webPipelineName=Pipeline web
