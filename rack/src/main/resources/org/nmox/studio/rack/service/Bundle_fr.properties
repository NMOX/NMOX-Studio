KvasirConsent_failureMessage=<html><b>Envoyer cet échec à {0} pour obtenir une explication ?</b><br><br>KVASIR n’enverra <b>que</b> ce qui suit, et rien d’autre :<ul><li>la commande en échec : <code>{1}</code></li><li>son code de sortie : <code>{2}</code></li><li>jusqu’à cinq lignes d’erreur échantillonnées</li><li>l’appareil (voie de tâche) : <code>{3}</code></li><li>le nom du projet : <code>{4}</code></li></ul>Il n’envoie <b>pas</b> vos fichiers source, ni les variables d’environnement, ni aucun secret.<br><br>Votre clé d’API sert à authentifier la requête. Ce choix est mémorisé.</html>
