KvasirConsent_kindMessage=<html><b>Envoyer ceci à {0} pour obtenir une explication ?</b><br><br>KVASIR n’enverra <b>que</b> ce qui suit, et rien d’autre :<ul><li>{1}</li></ul>Il n’envoie <b>rien</b> au-delà de la ligne ci-dessus — aucune variable d’environnement, aucun secret, rien qu’il n’ait nommé.<br><br>Votre clé d’API sert à authentifier la requête. Ce choix est mémorisé pour ce type de requête uniquement.</html>
