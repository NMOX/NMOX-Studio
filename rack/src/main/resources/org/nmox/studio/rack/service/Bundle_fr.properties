KvasirConsent_codeMessage=<html><b>Envoyer cette sélection de code à {0} ?</b><br><br>Demander à KVASIR n’enverra <b>que</b> ce qui suit, et rien d’autre :<ul><li>le code que vous avez sélectionné ({1} caractères)</li><li>le nom du fichier : <code>{2}</code></li><li>son langage : <code>{3}</code></li><li>votre question</li></ul>Il n’envoie <b>pas</b> le reste du fichier, ni d’autres fichiers, ni les variables d’environnement, ni aucun secret.<br><br>Votre clé d’API authentifie la requête. Ce choix est mémorisé.</html>
