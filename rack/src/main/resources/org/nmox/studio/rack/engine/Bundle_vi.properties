GitCheckoutGuard_midMerge=đang có một merge dở dang — hãy hoàn tất hoặc hủy nó trước (git merge --continue, hoặc git merge --abort)
GitCheckoutGuard_midRebase=đang có một rebase dở dang — hãy hoàn tất hoặc hủy nó trước (git rebase --continue, hoặc git rebase --abort)
GitCheckoutGuard_midCherryPick=đang có một cherry-pick dở dang — hãy hoàn tất hoặc hủy nó trước (git cherry-pick --continue, hoặc git cherry-pick --abort)
GitCheckoutGuard_midRevert=đang có một revert dở dang — hãy hoàn tất hoặc hủy nó trước (git revert --continue, hoặc git revert --abort)
GitCheckoutGuard_midAm=git am đang áp dụng bản vá — hãy hoàn tất hoặc hủy nó trước (git am --continue, hoặc git am --abort)
GitCheckoutGuard_midBisect=đang có một bisect dở dang — hãy kết thúc nó trước (git bisect reset)
