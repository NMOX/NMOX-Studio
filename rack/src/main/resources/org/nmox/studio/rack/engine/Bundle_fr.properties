GitCheckoutGuard_midMerge=un merge est en cours — terminez-le ou annulez-le d’abord (git merge --continue ou git merge --abort)
GitCheckoutGuard_midRebase=un rebase est en cours — terminez-le ou annulez-le d’abord (git rebase --continue ou git rebase --abort)
GitCheckoutGuard_midCherryPick=un cherry-pick est en cours — terminez-le ou annulez-le d’abord (git cherry-pick --continue ou git cherry-pick --abort)
GitCheckoutGuard_midRevert=un revert est en cours — terminez-le ou annulez-le d’abord (git revert --continue ou git revert --abort)
GitCheckoutGuard_midAm=git am applique des patchs — terminez-le ou annulez-le d’abord (git am --continue ou git am --abort)
GitCheckoutGuard_midBisect=un bisect est en cours — terminez-le d’abord (git bisect reset)
