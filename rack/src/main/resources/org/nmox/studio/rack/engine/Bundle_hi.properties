GitCheckoutGuard_midMerge=एक मर्ज चल रहा है — पहले उसे पूरा करें या रद्द करें (git merge --continue, या git merge --abort)
GitCheckoutGuard_midRebase=एक रीबेस चल रहा है — पहले उसे पूरा करें या रद्द करें (git rebase --continue, या git rebase --abort)
GitCheckoutGuard_midCherryPick=एक चेरी-पिक चल रहा है — पहले उसे पूरा करें या रद्द करें (git cherry-pick --continue, या git cherry-pick --abort)
GitCheckoutGuard_midRevert=एक रिवर्ट चल रहा है — पहले उसे पूरा करें या रद्द करें (git revert --continue, या git revert --abort)
