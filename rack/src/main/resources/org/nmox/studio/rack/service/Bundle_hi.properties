KvasirConsent_codeMessage=<html><b>यह कोड चयन {0} को भेजें?</b><br><br>Ask KVASIR <b>केवल</b> निम्नलिखित भेजेगा, और कुछ नहीं:<ul><li>आपका चुना हुआ कोड ({1} अक्षर)</li><li>फ़ाइल का नाम: <code>{2}</code></li><li>उसकी भाषा: <code>{3}</code></li><li>आपका प्रश्न</li></ul>यह बाक़ी फ़ाइल, अन्य फ़ाइलें, एनवायरनमेंट वेरिएबल या कोई भी गुप्त जानकारी <b>नहीं</b> भेजता।<br><br>आपकी API कुंजी अनुरोध को प्रमाणित करती है। यह चुनाव याद रखा जाता है।</html>
