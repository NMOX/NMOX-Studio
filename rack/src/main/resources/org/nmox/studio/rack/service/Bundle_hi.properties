KvasirConsent_kindMessage=<html><b>व्याख्या के लिए इसे {0} को भेजें?</b><br><br>KVASIR <b>केवल</b> निम्नलिखित भेजेगा, और कुछ नहीं:<ul><li>{1}</li></ul>यह ऊपर लिखी पंक्ति से आगे <b>कुछ भी</b> नहीं भेजता — न एनवायरनमेंट वेरिएबल, न कोई गुप्त जानकारी, न ही ऐसा कुछ जिसका नाम उसने नहीं लिया।<br><br>अनुरोध को प्रमाणित करने के लिए आपकी API कुंजी का उपयोग होता है। यह चुनाव केवल इसी प्रकार के अनुरोध के लिए याद रखा जाता है।</html>
