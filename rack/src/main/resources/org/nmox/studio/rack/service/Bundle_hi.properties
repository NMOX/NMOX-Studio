KvasirConsent_failureMessage=<html><b>व्याख्या के लिए यह विफलता {0} को भेजें?</b><br><br>KVASIR <b>केवल</b> निम्नलिखित भेजेगा, और कुछ नहीं:<ul><li>विफल कमांड: <code>{1}</code></li><li>उसका एग्ज़िट कोड: <code>{2}</code></li><li>अधिकतम पाँच नमूना त्रुटि पंक्तियाँ</li><li>डिवाइस (टास्क लेन): <code>{3}</code></li><li>प्रोजेक्ट का नाम: <code>{4}</code></li></ul>यह आपकी सोर्स फ़ाइलें, एनवायरनमेंट वेरिएबल या कोई भी गुप्त जानकारी <b>नहीं</b> भेजता।<br><br>अनुरोध को प्रमाणित करने के लिए आपकी API कुंजी का उपयोग होता है। यह चुनाव याद रखा जाता है।</html>
