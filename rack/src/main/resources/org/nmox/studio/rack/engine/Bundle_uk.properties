GitCheckoutGuard_midMerge=триває merge — спершу завершіть або перервіть його (git merge --continue або git merge --abort)
GitCheckoutGuard_midRebase=триває rebase — спершу завершіть або перервіть його (git rebase --continue або git rebase --abort)
GitCheckoutGuard_midCherryPick=триває cherry-pick — спершу завершіть або перервіть його (git cherry-pick --continue або git cherry-pick --abort)
GitCheckoutGuard_midRevert=триває revert — спершу завершіть або перервіть його (git revert --continue або git revert --abort)
GitCheckoutGuard_midAm=git am застосовує патчі — спершу завершіть або перервіть його (git am --continue або git am --abort)
GitCheckoutGuard_midBisect=триває bisect — спершу завершіть його (git bisect reset)
