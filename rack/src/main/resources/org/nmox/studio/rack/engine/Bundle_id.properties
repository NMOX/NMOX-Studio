GitCheckoutGuard_midMerge=merge sedang berlangsung — selesaikan atau batalkan dulu (git merge --continue, atau git merge --abort)
GitCheckoutGuard_midRebase=rebase sedang berlangsung — selesaikan atau batalkan dulu (git rebase --continue, atau git rebase --abort)
GitCheckoutGuard_midCherryPick=cherry-pick sedang berlangsung — selesaikan atau batalkan dulu (git cherry-pick --continue, atau git cherry-pick --abort)
GitCheckoutGuard_midRevert=revert sedang berlangsung — selesaikan atau batalkan dulu (git revert --continue, atau git revert --abort)
