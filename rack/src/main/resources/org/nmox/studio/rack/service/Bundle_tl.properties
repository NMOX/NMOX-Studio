KvasirConsent_codeMessage=<html><b>Ipadala ang napiling code na ito sa {0}?</b><br><br>Ipapadala <b>lamang</b> ng Magtanong sa KVASIR ang sumusunod, at wala nang iba:<ul><li>ang code na iyong napili ({1} na character)</li><li>ang pangalan ng file: <code>{2}</code></li><li>ang wika nito: <code>{3}</code></li><li>ang iyong tanong</li></ul><b>Hindi</b> nito ipinapadala ang natitirang bahagi ng file, ang ibang file, ang mga environment variable, o anumang lihim.<br><br>Pinapatotohanan ng iyong API key ang kahilingan. Naaalala ang pagpiling ito.</html>
KvasirConsent_codeTitle=Magtanong sa KVASIR — ipadala ang napiling code?
KvasirConsent_failureMessage=<html><b>Ipadala ang pagkabigong ito sa {0} para sa paliwanag?</b><br><br>Ipapadala <b>lamang</b> ng KVASIR ang sumusunod, at wala nang iba:<ul><li>ang nabigong utos: <code>{1}</code></li><li>ang exit code nito: <code>{2}</code></li><li>hanggang limang halimbawang linya ng error</li><li>ang device (task lane): <code>{3}</code></li><li>ang pangalan ng proyekto: <code>{4}</code></li></ul><b>Hindi</b> nito ipinapadala ang iyong mga source file, ang mga environment variable, o anumang lihim.<br><br>Ginagamit ang iyong API key para patotohanan ang kahilingan. Naaalala ang pagpiling ito.</html>
KvasirConsent_failureTitle=KVASIR — ipadala ang pagkabigo para sa paliwanag?
KvasirConsent_keepLocal=Panatilihing Lokal
KvasirConsent_kindMessage=<html><b>Ipadala ito sa {0} para sa paliwanag?</b><br><br>Ipapadala <b>lamang</b> ng KVASIR ang sumusunod, at wala nang iba:<ul><li>{1}</li></ul><b>Wala</b> itong ipinapadala maliban sa linyang nasa itaas — walang environment variable, walang lihim, walang hindi nito pinangalanan.<br><br>Ginagamit ang iyong API key para patotohanan ang kahilingan. Naaalala ang pagpiling ito para sa ganitong uri ng kahilingan lamang.</html>
